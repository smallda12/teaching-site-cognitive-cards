<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小動物｜認知圖卡網站</title>
<link rel="stylesheet" href="../css/site.css">
</head>
<body>

<a class="top-link" href="../index.html">← 返回首頁</a>

<div class="unit-header">
  <h1>🐹 小動物</h1>
  <div class="sub">47小動物B（共 10 項）</div>
</div>

<div class="stepper">
  <button class="step-btn" data-step="1"><span class="num">1</span>圖卡認識</button>
  <button class="step-btn" data-step="2"><span class="num">2</span>教學影片</button>
  <button class="step-btn" data-step="3"><span class="num">3</span>造詞造句</button>
  <button class="step-btn" data-step="4"><span class="num">4</span>Wordwall 練習</button>
</div>

<!-- Step 1：圖卡認識 -->
<section class="step-panel" data-step="1">
  <h2 class="panel-title">① 圖卡認識：點卡片聽發音</h2>

  <div class="view-toggle">
    <button class="view-btn" data-view="grid">🔲 全部呈現</button>
    <button class="view-btn" data-view="single">➡️ 逐張瀏覽</button>
  </div>

  <div class="view-panel" data-view="grid">
    <div class="group-heading">小動物</div>
    <div class="card-grid">
      <button class="flash-card" data-audio="47小動物B/assets/audio/p01.mp3"><img src="47小動物B/頁面截圖/000_蜘蛛.png" alt="蜘蛛"><span class="label">蜘蛛</span></button>
      <button class="flash-card" data-audio="47小動物B/assets/audio/p02.mp3"><img src="47小動物B/頁面截圖/001_蝸牛.png" alt="蝸牛"><span class="label">蝸牛</span></button>
      <button class="flash-card" data-audio="47小動物B/assets/audio/p03.mp3"><img src="47小動物B/頁面截圖/002_蚯蚓.png" alt="蚯蚓"><span class="label">蚯蚓</span></button>
      <button class="flash-card" data-audio="47小動物B/assets/audio/p04.mp3"><img src="47小動物B/頁面截圖/003_毛毛蟲.png" alt="毛毛蟲"><span class="label">毛毛蟲</span></button>
      <button class="flash-card" data-audio="47小動物B/assets/audio/p05.mp3"><img src="47小動物B/頁面截圖/004_蒼蠅.png" alt="蒼蠅"><span class="label">蒼蠅</span></button>
      <button class="flash-card" data-audio="47小動物B/assets/audio/p06.mp3"><img src="47小動物B/頁面截圖/005_蚊子.png" alt="蚊子"><span class="label">蚊子</span></button>
      <button class="flash-card" data-audio="47小動物B/assets/audio/p07.mp3"><img src="47小動物B/頁面截圖/006_壁虎.png" alt="壁虎"><span class="label">壁虎</span></button>
      <button class="flash-card" data-audio="47小動物B/assets/audio/p08.mp3"><img src="47小動物B/頁面截圖/007_青蛙.png" alt="青蛙"><span class="label">青蛙</span></button>
      <button class="flash-card" data-audio="47小動物B/assets/audio/p09.mp3"><img src="47小動物B/頁面截圖/008_蟾蜍.png" alt="蟾蜍"><span class="label">蟾蜍</span></button>
      <button class="flash-card" data-audio="47小動物B/assets/audio/p10.mp3"><img src="47小動物B/頁面截圖/009_螢火蟲.png" alt="螢火蟲"><span class="label">螢火蟲</span></button>
    </div>
  </div>

  <div class="view-panel" data-view="single">
    <div class="single-wrap">
      <div class="single-header">
        <span id="singleGroup">小動物</span>
        <span class="single-count" id="singleCount">1 / 10</span>
      </div>
      <div class="single-frame">
        <img id="singleImg" src="" alt="">
      </div>
      <div class="single-label" id="singleLabel"></div>
      <div class="single-controls">
        <button class="ctrl btn-nav" id="singlePrev" type="button">◀ 上一張</button>
        <button class="ctrl btn-play" id="singlePlay" type="button">🔊 重複播放</button>
        <button class="ctrl btn-auto" id="singleAuto" type="button">▶ 自動播放</button>
        <button class="ctrl btn-nav" id="singleNext" type="button">下一張 ▶</button>
      </div>
    </div>
  </div>

  <audio id="cardAudio" preload="none"></audio>
</section>

<!-- Step 2：教學影片 -->
<section class="step-panel" data-step="2">
  <h2 class="panel-title">② 教學影片：跟著唸讀</h2>
  <div class="link-card-row">
    <a class="link-card" href="47小動物B/教材播放器.html">
      <div class="emoji">🎬</div>
      <div class="title">小動物 教學影片</div>
      <div class="desc">蜘蛛、蝸牛、蚯蚓、毛毛蟲、蒼蠅、蚊子、壁虎、青蛙、蟾蜍、螢火蟲</div>
      <div class="go-btn">開始播放</div>
    </a>
  </div>
</section>

<!-- Step 3：造詞造句 -->
<section class="step-panel" data-step="3">
  <h2 class="panel-title">③ 造詞造句：跟著唸讀</h2>
  <div class="link-card-row">
    <a class="link-card" href="47小動物B/造詞造句版/教材播放器.html">
      <div class="emoji">📝</div>
      <div class="title">小動物 造詞造句</div>
      <div class="desc">例：蜘蛛 → 一隻蜘蛛 → 我看到蜘蛛</div>
      <div class="go-btn">開始練習</div>
    </a>
  </div>
</section>

<!-- Step 4：Wordwall 練習 -->
<section class="step-panel" data-step="4">
  <h2 class="panel-title">④ Wordwall 題庫練習</h2>

  <div class="quiz-group">
    <div class="group-heading">小動物</div>
    <div class="quiz-btns">
      <a class="quiz-btn" target="_blank" rel="noopener" href="https://wordwall.net/tc/resource/118380802"><span class="icon">🃏</span>隨機卡</a>
      <a class="quiz-btn" target="_blank" rel="noopener" href="https://wordwall.net/tc/resource/118380837"><span class="icon">🔎</span>圖片文字匹配</a>
      <a class="quiz-btn" target="_blank" rel="noopener" href="https://wordwall.net/tc/resource/118380867"><span class="icon">🔊</span>只有聲音</a>
      <a class="quiz-btn" target="_blank" rel="noopener" href="https://wordwall.net/tc/resource/118380907"><span class="icon">🖼️</span>圖像測驗</a>
    </div>
  </div>
</section>

<script src="js/unit.js"></script>
</body>
</html>
