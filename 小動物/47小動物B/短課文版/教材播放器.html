<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小動物 B 短課文</title>
<style>
  :root{
    --bg:#FFF6E9;
    --primary:#4A90D9;
    --primary-dark:#3573B5;
    --accent:#FF8C61;
    --accent-dark:#E8703D;
    --text:#3A3A3A;
    --dot:#D8D8D8;
    --dot-active:#4A90D9;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:var(--bg);
    font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
    color:var(--text);
    -webkit-user-select:none;user-select:none;
    overflow:hidden;
  }
  body{
    display:flex;flex-direction:column;
    align-items:center;
    height:100vh;
    padding:1.5vh 16px;
    gap:1.2vh;
  }
  header{
    display:flex;align-items:center;justify-content:center;gap:16px;
    width:100%;
    flex:0 0 auto;
    flex-wrap:wrap;
  }
  h1{
    font-size:clamp(18px,3.2vh,32px);
    margin:0;
  }
  .back-link{
    position:fixed;top:10px;left:12px;
    font-size:clamp(13px,2vh,18px);
    color:var(--primary-dark);
    text-decoration:none;
    background:#fff;
    padding:6px 14px;
    border-radius:999px;
    box-shadow:0 2px 6px rgba(0,0,0,.10);
    z-index:10;
  }
  .back-link:hover{background:var(--bg);}
  .page-count{
    font-size:clamp(14px,2.4vh,24px);
    color:var(--primary-dark);
    font-weight:bold;
    background:#fff;
    padding:4px 16px;
    border-radius:999px;
    box-shadow:0 2px 6px rgba(0,0,0,.10);
  }
  .stage{
    flex:1 1 auto;
    min-height:0;
    width:100%;
    max-width:1100px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .frame{
    max-width:100%;
    max-height:100%;
    background:#000;
    border-radius:28px;
    overflow:hidden;
    box-shadow:0 10px 28px rgba(0,0,0,.20);
    position:relative;
  }
  .frame img{
    width:100%;height:100%;object-fit:contain;
    background:#fff;
    display:block;
  }
  .dots{
    display:flex;gap:7px;flex-wrap:wrap;justify-content:center;
    max-width:900px;
    flex:0 0 auto;
  }
  .dot{
    width:clamp(9px,1.4vh,14px);height:clamp(9px,1.4vh,14px);border-radius:50%;
    background:var(--dot);
    cursor:pointer;
    transition:transform .15s, background .15s;
  }
  .dot.active{background:var(--dot-active);transform:scale(1.35);}
  .controls{
    display:flex;align-items:center;justify-content:center;gap:min(4vw,22px);
    width:100%;
    flex:0 0 auto;
    flex-wrap:wrap;
  }
  button.ctrl{
    border:none;
    border-radius:18px;
    font-size:clamp(15px,2.4vh,24px);
    font-weight:bold;
    padding:1.4vh 20px;
    min-width:110px;
    min-height:clamp(48px,7.5vh,68px);
    cursor:pointer;
    color:#fff;
    box-shadow:0 4px 10px rgba(0,0,0,.15);
    display:flex;align-items:center;justify-content:center;gap:8px;
    transition:transform .1s, opacity .15s, background .15s;
    font-family:inherit;
  }
  button.ctrl:active{transform:scale(.95);}
  button.ctrl:disabled{opacity:.35;cursor:default;}
  .btn-nav{background:var(--primary);}
  .btn-nav:hover:not(:disabled){background:var(--primary-dark);}
  .btn-play{
    background:var(--accent);
    min-width:190px;
    font-size:clamp(16px,2.7vh,26px);
  }
  .btn-play:hover{background:var(--accent-dark);}
  .btn-play.playing{animation:pulse 1s infinite;}
  .btn-auto{background:#4CAF7D;min-width:170px;}
  .btn-auto:hover{background:#3D9468;}
  .btn-auto.active{background:var(--accent-dark);animation:pulse 1s infinite;}
  @keyframes pulse{
    0%,100%{box-shadow:0 4px 10px rgba(0,0,0,.15);}
    50%{box-shadow:0 4px 24px rgba(255,140,97,.7);}
  }
</style>
</head>
<body>
  <a class="back-link" href="../../index.html">← 返回小動物單元</a>
  <header>
    <h1>小動物 B 短課文</h1>
    <div class="page-count" id="pageCount">1 / 1</div>
  </header>

  <div class="stage">
    <div class="frame">
      <img id="pageImg" src="" alt="">
    </div>
  </div>

  <div class="dots" id="dots"></div>

  <div class="controls">
    <button class="ctrl btn-nav" id="prevBtn" type="button">◀ 上一頁</button>
    <button class="ctrl btn-play" id="playBtn" type="button">🔊 重複播放</button>
    <button class="ctrl btn-auto" id="autoBtn" type="button">▶ 自動播放</button>
    <button class="ctrl btn-nav" id="nextBtn" type="button">下一頁 ▶</button>
  </div>

  <audio id="audioPlayer" preload="auto"></audio>

  <script>
  const pages = [
    {img:"頁面截圖/000_蜘蛛.png", audio:"assets/audio/p01.mp3", label:"蜘蛛"},
    {img:"頁面截圖/001_這是一隻彩蜘蛛.png", audio:"assets/audio/p02.mp3", label:"這是一隻彩蜘蛛"},
    {img:"頁面截圖/002_八隻長腳織圓網.png", audio:"assets/audio/p03.mp3", label:"八隻長腳織圓網"},
    {img:"頁面截圖/003_吐出細絲捕昆蟲.png", audio:"assets/audio/p04.mp3", label:"吐出細絲捕昆蟲"},
    {img:"頁面截圖/004_我看蜘蛛在屋簷織網.png", audio:"assets/audio/p05.mp3", label:"我看蜘蛛在屋簷織網"},
    {img:"頁面截圖/005_蝸牛.png", audio:"assets/audio/p06.mp3", label:"蝸牛"},
    {img:"頁面截圖/006_這是一隻小蝸牛.png", audio:"assets/audio/p07.mp3", label:"這是一隻小蝸牛"},
    {img:"頁面截圖/007_背著重殼慢慢爬.png", audio:"assets/audio/p08.mp3", label:"背著重殼慢慢爬"},
    {img:"頁面截圖/008_下雨過後爬出來.png", audio:"assets/audio/p09.mp3", label:"下雨過後爬出來"},
    {img:"頁面截圖/009_我看蝸牛在花盆上爬.png", audio:"assets/audio/p10.mp3", label:"我看蝸牛在花盆上爬"},
    {img:"頁面截圖/010_蚯蚓.png", audio:"assets/audio/p11.mp3", label:"蚯蚓"},
    {img:"頁面截圖/011_這是一條長蚯蚓.png", audio:"assets/audio/p12.mp3", label:"這是一條長蚯蚓"},
    {img:"頁面截圖/012_軟軟身體無手腳.png", audio:"assets/audio/p13.mp3", label:"軟軟身體無手腳"},
    {img:"頁面截圖/013_鑽進泥土鬆鬆土.png", audio:"assets/audio/p14.mp3", label:"鑽進泥土鬆鬆土"},
    {img:"頁面截圖/014_我看蚯蚓在泥土裡翻土.png", audio:"assets/audio/p15.mp3", label:"我看蚯蚓在泥土裡翻土"},
    {img:"頁面截圖/015_毛毛蟲.png", audio:"assets/audio/p16.mp3", label:"毛毛蟲"},
    {img:"頁面截圖/016_這是一隻毛毛蟲.png", audio:"assets/audio/p17.mp3", label:"這是一隻毛毛蟲"},
    {img:"頁面截圖/017_綠色身體啃綠葉.png", audio:"assets/audio/p18.mp3", label:"綠色身體啃綠葉"},
    {img:"頁面截圖/018_長大變成彩蝴蝶.png", audio:"assets/audio/p19.mp3", label:"長大變成彩蝴蝶"},
    {img:"頁面截圖/019_我看毛毛蟲大口吃葉子.png", audio:"assets/audio/p20.mp3", label:"我看毛毛蟲大口吃葉子"},
    {img:"頁面截圖/020_蒼蠅.png", audio:"assets/audio/p21.mp3", label:"蒼蠅"},
    {img:"頁面截圖/021_這是一隻黑蒼蠅.png", audio:"assets/audio/p22.mp3", label:"這是一隻黑蒼蠅"},
    {img:"頁面截圖/022_透明薄翅飛得快.png", audio:"assets/audio/p23.mp3", label:"透明薄翅飛得快"},
    {img:"頁面截圖/023_搓搓前腳嗡嗡飛.png", audio:"assets/audio/p24.mp3", label:"搓搓前腳嗡嗡飛"},
    {img:"頁面截圖/024_我拿蒼蠅拍趕走蒼蠅.png", audio:"assets/audio/p25.mp3", label:"我拿蒼蠅拍趕走蒼蠅"},
    {img:"頁面截圖/025_蚊子.png", audio:"assets/audio/p26.mp3", label:"蚊子"},
    {img:"頁面截圖/026_這是一隻細蚊子.png", audio:"assets/audio/p27.mp3", label:"這是一隻細蚊子"},
    {img:"頁面截圖/027_細長針嘴嗡嗡叫.png", audio:"assets/audio/p28.mp3", label:"細長針嘴嗡嗡叫"},
    {img:"頁面截圖/028_叮咬皮膚紅又癢.png", audio:"assets/audio/p29.mp3", label:"叮咬皮膚紅又癢"},
    {img:"頁面截圖/029_我點蚊香防蚊子叮咬.png", audio:"assets/audio/p30.mp3", label:"我點蚊香防蚊子叮咬"},
    {img:"頁面截圖/030_壁虎.png", audio:"assets/audio/p31.mp3", label:"壁虎"},
    {img:"頁面截圖/031_這是一隻小壁虎.png", audio:"assets/audio/p32.mp3", label:"這是一隻小壁虎"},
    {img:"頁面截圖/032_吸盤腳掌爬牆壁.png", audio:"assets/audio/p33.mp3", label:"吸盤腳掌爬牆壁"},
    {img:"頁面截圖/033_吃掉蚊子是益蟲.png", audio:"assets/audio/p34.mp3", label:"吃掉蚊子是益蟲"},
    {img:"頁面截圖/034_我看壁虎在牆上抓蚊子.png", audio:"assets/audio/p35.mp3", label:"我看壁虎在牆上抓蚊子"},
    {img:"頁面截圖/035_青蛙.png", audio:"assets/audio/p36.mp3", label:"青蛙"},
    {img:"頁面截圖/036_這是一隻綠青蛙.png", audio:"assets/audio/p37.mp3", label:"這是一隻綠青蛙"},
    {img:"頁面截圖/037_綠綠皮膚呱呱呱.png", audio:"assets/audio/p38.mp3", label:"綠綠皮膚呱呱呱"},
    {img:"頁面截圖/038_坐在荷葉呱呱叫.png", audio:"assets/audio/p39.mp3", label:"坐在荷葉呱呱叫"},
    {img:"頁面截圖/039_我看青蛙在荷葉上跳水.png", audio:"assets/audio/p40.mp3", label:"我看青蛙在荷葉上跳水"},
    {img:"頁面截圖/040_蟾蜍.png", audio:"assets/audio/p41.mp3", label:"蟾蜍"},
    {img:"頁面截圖/041_這是一隻大蟾蜍.png", audio:"assets/audio/p42.mp3", label:"這是一隻大蟾蜍"},
    {img:"頁面截圖/042_凸凸顆粒粗皮膚.png", audio:"assets/audio/p43.mp3", label:"凸凸顆粒粗皮膚"},
    {img:"頁面截圖/043_慢步爬行捕小蟲.png", audio:"assets/audio/p44.mp3", label:"慢步爬行捕小蟲"},
    {img:"頁面截圖/044_我在草叢旁看蟾蜍爬行.png", audio:"assets/audio/p45.mp3", label:"我在草叢旁看蟾蜍爬行"},
    {img:"頁面截圖/045_螢火蟲.png", audio:"assets/audio/p46.mp3", label:"螢火蟲"},
    {img:"頁面截圖/046_這是一隻螢火蟲.png", audio:"assets/audio/p47.mp3", label:"這是一隻螢火蟲"},
    {img:"頁面截圖/047_尾部發出黃綠光.png", audio:"assets/audio/p48.mp3", label:"尾部發出黃綠光"},
    {img:"頁面截圖/048_夜晚提燈點點亮.png", audio:"assets/audio/p49.mp3", label:"夜晚提燈點點亮"},
    {img:"頁面截圖/049_我在黑夜看螢火蟲發光.png", audio:"assets/audio/p50.mp3", label:"我在黑夜看螢火蟲發光"},
  ];

  let current = 0;
  let audioUnlocked = false;
  let autoPlay = false;
  let autoTimer = null;

  const pageImg = document.getElementById('pageImg');
  const pageCount = document.getElementById('pageCount');
  const dotsWrap = document.getElementById('dots');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const playBtn = document.getElementById('playBtn');
  const autoBtn = document.getElementById('autoBtn');
  const audioPlayer = document.getElementById('audioPlayer');
  const stage = document.querySelector('.stage');
  const frame = document.querySelector('.frame');

  // 讓 16:9 的畫面框在「扣掉頁碼／圓點／按鈕之後剩下的空間」裡盡量放大，
  // 同時保證整頁一定塞得進 100vh，不需要捲動——純 CSS（flex + aspect-ratio）
  // 在直式或接近正方形的視窗下算不準，用 JS 直接量測、算好再賦值最可靠。
  function fitFrame(){
    const ratio = 1.0;
    const availW = stage.clientWidth;
    const availH = stage.clientHeight;
    let w = availW, h = w / ratio;
    if (h > availH){ h = availH; w = h * ratio; }
    frame.style.width = w + 'px';
    frame.style.height = h + 'px';
  }
  window.addEventListener('resize', fitFrame);
  fitFrame();

  pages.forEach((_, i) => {
    const dot = document.createElement('div');
    dot.className = 'dot';
    dot.addEventListener('click', () => goTo(i));
    dotsWrap.appendChild(dot);
  });
  const dotEls = Array.from(dotsWrap.children);

  function updateDots(){
    dotEls.forEach((d,i)=> d.classList.toggle('active', i===current));
  }

  function playCurrentAudio(){
    audioPlayer.currentTime = 0;
    const p = audioPlayer.play();
    if (p !== undefined){
      p.then(()=>{
        audioUnlocked = true;
        playBtn.classList.add('playing');
      }).catch(()=>{
        // 瀏覽器擋自動播放時靜靜失敗即可，按「重複播放」按鈕還是能手動播放
      });
    }
  }


  function updateAutoBtn(){
    autoBtn.classList.toggle('active', autoPlay);
    autoBtn.textContent = autoPlay ? '⏸ 停止自動播放' : '▶ 自動播放';
  }

  function stopAuto(){
    autoPlay = false;
    updateAutoBtn();
    clearTimeout(autoTimer);
  }

  function render(autoplay){
    const page = pages[current];
    pageImg.src = page.img;
    pageImg.alt = page.label;
    pageCount.textContent = (current+1) + ' / ' + pages.length;
    audioPlayer.src = page.audio;
    prevBtn.disabled = current === 0;
    nextBtn.disabled = current === pages.length - 1;
    updateDots();
    playBtn.classList.remove('playing');
    if (autoplay){
      playCurrentAudio();
    }
  }

  function goTo(i){
    if (i<0 || i>=pages.length) return;
    current = i;
    render(true);
  }

  prevBtn.addEventListener('click', ()=> { stopAuto(); goTo(current-1); });
  nextBtn.addEventListener('click', ()=> { stopAuto(); goTo(current+1); });
  playBtn.addEventListener('click', ()=> { audioUnlocked = true; playCurrentAudio(); });
  autoBtn.addEventListener('click', ()=>{
    audioUnlocked = true;
    autoPlay = !autoPlay;
    updateAutoBtn();
    if (autoPlay) playCurrentAudio();
    else clearTimeout(autoTimer);
  });

  audioPlayer.addEventListener('ended', ()=>{
    playBtn.classList.remove('playing');
    if (!autoPlay) return;
    if (current < pages.length - 1){
      autoTimer = setTimeout(()=> goTo(current+1), 700);
    } else {
      stopAuto();
    }
  });

  document.addEventListener('keydown', (e)=>{
    if (e.key === 'ArrowRight'){ stopAuto(); goTo(current+1); }
    else if (e.key === 'ArrowLeft'){ stopAuto(); goTo(current-1); }
    else if (e.key === ' '){ e.preventDefault(); playCurrentAudio(); }
  });

  render(true);
  </script>
</body>
</html>
