<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>飲料｜認知圖卡網站</title>
<link rel="stylesheet" href="../css/site.css">
</head>
<body>

<a class="top-link" href="../index.html">← 返回首頁</a>

<div class="unit-header">
  <h1>🥤 飲料</h1>
  <div class="sub">07飲料（共 10 項，實拍照片）</div>
</div>

<div class="stepper">
  <button class="step-btn" data-step="1"><span class="num">1</span>圖卡認識</button>
  <button class="step-btn" data-step="2"><span class="num">2</span>教學影片</button>
  <button class="step-btn" data-step="3"><span class="num">3</span>造詞造句</button>
  <button class="step-btn" data-step="4"><span class="num">4</span>Wordwall 練習</button>
</div>

<!-- Step 1：圖卡認識 -->
<section class="step-panel" data-step="1">
  <h2 class="panel-title">① 圖卡認識：點卡片聽發音</h2>

  <div class="view-toggle">
    <button class="view-btn" data-view="grid">🔲 全部呈現</button>
    <button class="view-btn" data-view="single">➡️ 逐張瀏覽</button>
  </div>

  <!-- 全部呈現 -->
  <div class="view-panel" data-view="grid">
    <div class="group-heading">飲料</div>
    <div class="card-grid">
      <button class="flash-card" data-audio="07飲料/assets/audio/p01.mp3"><img src="07飲料/頁面截圖/000_水.png" alt="水"><span class="label">水</span></button>
      <button class="flash-card" data-audio="07飲料/assets/audio/p02.mp3"><img src="07飲料/頁面截圖/001_牛奶.png" alt="牛奶"><span class="label">牛奶</span></button>
      <button class="flash-card" data-audio="07飲料/assets/audio/p03.mp3"><img src="07飲料/頁面截圖/002_豆漿.png" alt="豆漿"><span class="label">豆漿</span></button>
      <button class="flash-card" data-audio="07飲料/assets/audio/p04.mp3"><img src="07飲料/頁面截圖/003_柳橙汁.png" alt="柳橙汁"><span class="label">柳橙汁</span></button>
      <button class="flash-card" data-audio="07飲料/assets/audio/p05.mp3"><img src="07飲料/頁面截圖/004_汽水.png" alt="汽水"><span class="label">汽水</span></button>
      <button class="flash-card" data-audio="07飲料/assets/audio/p06.mp3"><img src="07飲料/頁面截圖/005_紅茶.png" alt="紅茶"><span class="label">紅茶</span></button>
      <button class="flash-card" data-audio="07飲料/assets/audio/p07.mp3"><img src="07飲料/頁面截圖/006_奶茶.png" alt="奶茶"><span class="label">奶茶</span></button>
      <button class="flash-card" data-audio="07飲料/assets/audio/p08.mp3"><img src="07飲料/頁面截圖/007_養樂多.png" alt="養樂多"><span class="label">養樂多</span></button>
      <button class="flash-card" data-audio="07飲料/assets/audio/p09.mp3"><img src="07飲料/頁面截圖/008_運動飲料.png" alt="運動飲料"><span class="label">運動飲料</span></button>
      <button class="flash-card" data-audio="07飲料/assets/audio/p10.mp3"><img src="07飲料/頁面截圖/009_米漿.png" alt="米漿"><span class="label">米漿</span></button>
    </div>
  </div>

  <!-- 逐張瀏覽 -->
  <div class="view-panel" data-view="single">
    <div class="single-wrap">
      <div class="single-header">
        <span id="singleGroup">飲料</span>
        <span class="single-count" id="singleCount">1 / 10</span>
      </div>
      <div class="single-frame">
        <img id="singleImg" src="" alt="">
      </div>
      <div class="single-label" id="singleLabel"></div>
      <div class="single-controls">
        <button class="ctrl btn-nav" id="singlePrev" type="button">◀ 上一張</button>
        <button class="ctrl btn-play" id="singlePlay" type="button">🔊 重複播放</button>
        <button class="ctrl btn-auto" id="singleAuto" type="button">▶ 自動播放</button>
        <button class="ctrl btn-nav" id="singleNext" type="button">下一張 ▶</button>
      </div>
    </div>
  </div>

  <audio id="cardAudio" preload="none"></audio>
</section>

<!-- Step 2：教學影片 -->
<section class="step-panel" data-step="2">
  <h2 class="panel-title">② 教學影片：跟著唸讀</h2>
  <div class="link-card-row">
    <a class="link-card" href="07飲料/教材播放器.html">
      <div class="emoji">🎬</div>
      <div class="title">飲料 教學影片</div>
      <div class="desc">水、牛奶、豆漿、柳橙汁、汽水、紅茶、奶茶、養樂多、運動飲料、米漿</div>
      <div class="go-btn">開始播放</div>
    </a>
  </div>
</section>

<!-- Step 3：造詞造句 -->
<section class="step-panel" data-step="3">
  <h2 class="panel-title">③ 造詞造句：跟著唸讀</h2>
  <div class="link-card-row">
    <a class="link-card" href="07飲料/造詞造句版/教材播放器.html">
      <div class="emoji">📝</div>
      <div class="title">飲料 造詞造句</div>
      <div class="desc">例：牛奶 → 一盒牛奶 → 我想喝牛奶</div>
      <div class="go-btn">開始練習</div>
    </a>
  </div>
</section>

<!-- Step 4：Wordwall 練習 -->
<section class="step-panel" data-step="4">
  <h2 class="panel-title">④ Wordwall 題庫練習</h2>

  <div class="quiz-group">
    <div class="group-heading">飲料</div>
    <div class="quiz-btns">
      <a class="quiz-btn" target="_blank" rel="noopener" href="https://wordwall.net/tc/resource/118915708"><span class="icon">🃏</span>隨機卡</a>
      <a class="quiz-btn" target="_blank" rel="noopener" href="https://wordwall.net/tc/resource/118915760"><span class="icon">🔎</span>圖片文字匹配</a>
      <a class="quiz-btn" target="_blank" rel="noopener" href="https://wordwall.net/tc/resource/118915785"><span class="icon">🔊</span>只有聲音</a>
      <a class="quiz-btn" target="_blank" rel="noopener" href="https://wordwall.net/tc/resource/118915862"><span class="icon">🖼️</span>圖像測驗</a>
    </div>
  </div>
</section>

<script src="js/unit.js"></script>
</body>
</html>
