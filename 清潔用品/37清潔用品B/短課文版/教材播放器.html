<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>清潔用品 B 短課文</title>
<style>
  :root{
    --bg:#FFF6E9;
    --primary:#4A90D9;
    --primary-dark:#3573B5;
    --accent:#FF8C61;
    --accent-dark:#E8703D;
    --text:#3A3A3A;
    --dot:#D8D8D8;
    --dot-active:#4A90D9;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:var(--bg);
    font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
    color:var(--text);
    -webkit-user-select:none;user-select:none;
    overflow:hidden;
  }
  body{
    display:flex;flex-direction:column;
    align-items:center;
    height:100vh;
    padding:1.5vh 16px;
    gap:1.2vh;
  }
  header{
    display:flex;align-items:center;justify-content:center;gap:16px;
    width:100%;
    flex:0 0 auto;
    flex-wrap:wrap;
  }
  h1{
    font-size:clamp(18px,3.2vh,32px);
    margin:0;
  }
  .back-link{
    position:fixed;top:10px;left:12px;
    font-size:clamp(13px,2vh,18px);
    color:var(--primary-dark);
    text-decoration:none;
    background:#fff;
    padding:6px 14px;
    border-radius:999px;
    box-shadow:0 2px 6px rgba(0,0,0,.10);
    z-index:10;
  }
  .back-link:hover{background:var(--bg);}
  .page-count{
    font-size:clamp(14px,2.4vh,24px);
    color:var(--primary-dark);
    font-weight:bold;
    background:#fff;
    padding:4px 16px;
    border-radius:999px;
    box-shadow:0 2px 6px rgba(0,0,0,.10);
  }
  .stage{
    flex:1 1 auto;
    min-height:0;
    width:100%;
    max-width:1100px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .frame{
    max-width:100%;
    max-height:100%;
    background:#000;
    border-radius:28px;
    overflow:hidden;
    box-shadow:0 10px 28px rgba(0,0,0,.20);
    position:relative;
  }
  .frame img{
    width:100%;height:100%;object-fit:contain;
    background:#fff;
    display:block;
  }
  .dots{
    display:flex;gap:7px;flex-wrap:wrap;justify-content:center;
    max-width:900px;
    flex:0 0 auto;
  }
  .dot{
    width:clamp(9px,1.4vh,14px);height:clamp(9px,1.4vh,14px);border-radius:50%;
    background:var(--dot);
    cursor:pointer;
    transition:transform .15s, background .15s;
  }
  .dot.active{background:var(--dot-active);transform:scale(1.35);}
  .controls{
    display:flex;align-items:center;justify-content:center;gap:min(4vw,22px);
    width:100%;
    flex:0 0 auto;
    flex-wrap:wrap;
  }
  button.ctrl{
    border:none;
    border-radius:18px;
    font-size:clamp(15px,2.4vh,24px);
    font-weight:bold;
    padding:1.4vh 20px;
    min-width:110px;
    min-height:clamp(48px,7.5vh,68px);
    cursor:pointer;
    color:#fff;
    box-shadow:0 4px 10px rgba(0,0,0,.15);
    display:flex;align-items:center;justify-content:center;gap:8px;
    transition:transform .1s, opacity .15s, background .15s;
    font-family:inherit;
  }
  button.ctrl:active{transform:scale(.95);}
  button.ctrl:disabled{opacity:.35;cursor:default;}
  .btn-nav{background:var(--primary);}
  .btn-nav:hover:not(:disabled){background:var(--primary-dark);}
  .btn-play{
    background:var(--accent);
    min-width:190px;
    font-size:clamp(16px,2.7vh,26px);
  }
  .btn-play:hover{background:var(--accent-dark);}
  .btn-play.playing{animation:pulse 1s infinite;}
  .btn-auto{background:#4CAF7D;min-width:170px;}
  .btn-auto:hover{background:#3D9468;}
  .btn-auto.active{background:var(--accent-dark);animation:pulse 1s infinite;}
  @keyframes pulse{
    0%,100%{box-shadow:0 4px 10px rgba(0,0,0,.15);}
    50%{box-shadow:0 4px 24px rgba(255,140,97,.7);}
  }
</style>
</head>
<body>
  <a class="back-link" href="../../index.html">← 返回清潔用品單元</a>
  <header>
    <h1>清潔用品 B 短課文</h1>
    <div class="page-count" id="pageCount">1 / 1</div>
  </header>

  <div class="stage">
    <div class="frame">
      <img id="pageImg" src="" alt="">
    </div>
  </div>

  <div class="dots" id="dots"></div>

  <div class="controls">
    <button class="ctrl btn-nav" id="prevBtn" type="button">◀ 上一頁</button>
    <button class="ctrl btn-play" id="playBtn" type="button">🔊 重複播放</button>
    <button class="ctrl btn-auto" id="autoBtn" type="button">▶ 自動播放</button>
    <button class="ctrl btn-nav" id="nextBtn" type="button">下一頁 ▶</button>
  </div>

  <audio id="audioPlayer" preload="auto"></audio>

  <script>
  const pages = [
    {img:"頁面截圖/000_洗衣精.png", audio:"assets/audio/p01.mp3", label:"洗衣精"},
    {img:"頁面截圖/001_倒出帶花香的洗衣精.png", audio:"assets/audio/p02.mp3", label:"倒出帶花香的洗衣精"},
    {img:"頁面截圖/002_倒進洗衣機洗出香衣服.png", audio:"assets/audio/p03.mp3", label:"倒進洗衣機洗出香衣服"},
    {img:"頁面截圖/003_衣服散發淡淡香氣.png", audio:"assets/audio/p04.mp3", label:"衣服散發淡淡香氣"},
    {img:"頁面截圖/004_洗碗精.png", audio:"assets/audio/p05.mp3", label:"洗碗精"},
    {img:"頁面截圖/005_檸檬清香洗碗精壓頭.png", audio:"assets/audio/p06.mp3", label:"檸檬清香洗碗精壓頭"},
    {img:"頁面截圖/006_洗碗精搓出豐富泡沫.png", audio:"assets/audio/p07.mp3", label:"洗碗精搓出豐富泡沫"},
    {img:"頁面截圖/007_輕輕鬆鬆洗去油脂.png", audio:"assets/audio/p08.mp3", label:"輕輕鬆鬆洗去油脂"},
    {img:"頁面截圖/008_濕紙巾.png", audio:"assets/audio/p09.mp3", label:"濕紙巾"},
    {img:"頁面截圖/009_翻蓋式加厚純水濕紙巾.png", audio:"assets/audio/p10.mp3", label:"翻蓋式加厚純水濕紙巾"},
    {img:"頁面截圖/010_抽一張濕紙巾擦擦手.png", audio:"assets/audio/p11.mp3", label:"抽一張濕紙巾擦擦手"},
    {img:"頁面截圖/011_隨時保持乾淨衛生.png", audio:"assets/audio/p12.mp3", label:"隨時保持乾淨衛生"},
    {img:"頁面截圖/012_除塵紙.png", audio:"assets/audio/p13.mp3", label:"除塵紙"},
    {img:"頁面截圖/013_立體壓紋靜電除塵紙.png", audio:"assets/audio/p14.mp3", label:"立體壓紋靜電除塵紙"},
    {img:"頁面截圖/014_推動除塵拖把吸附毛髮.png", audio:"assets/audio/p15.mp3", label:"推動除塵拖把吸附毛髮"},
    {img:"頁面截圖/015_靜電把落髮全吸光.png", audio:"assets/audio/p16.mp3", label:"靜電把落髮全吸光"},
    {img:"頁面截圖/016_海綿.png", audio:"assets/audio/p17.mp3", label:"海綿"},
    {img:"頁面截圖/017_多孔吸水高密度大海綿.png", audio:"assets/audio/p18.mp3", label:"多孔吸水高密度大海綿"},
    {img:"頁面截圖/018_浸濕海綿擦拭磁磚牆面.png", audio:"assets/audio/p19.mp3", label:"浸濕海綿擦拭磁磚牆面"},
    {img:"頁面截圖/019_海綿吸水力強好擦拭.png", audio:"assets/audio/p20.mp3", label:"海綿吸水力強好擦拭"},
    {img:"頁面截圖/020_洗衣籃.png", audio:"assets/audio/p21.mp3", label:"洗衣籃"},
    {img:"頁面截圖/021_透氣鏤空塑膠洗衣籃.png", audio:"assets/audio/p22.mp3", label:"透氣鏤空塑膠洗衣籃"},
    {img:"頁面截圖/022_髒衣服放進透氣籃子裡.png", audio:"assets/audio/p23.mp3", label:"髒衣服放進透氣籃子裡"},
    {img:"頁面截圖/023_衣服分開收納不雜亂.png", audio:"assets/audio/p24.mp3", label:"衣服分開收納不雜亂"},
    {img:"頁面截圖/024_曬衣桿.png", audio:"assets/audio/p25.mp3", label:"曬衣桿"},
    {img:"頁面截圖/025_不鏽鋼伸縮防風曬衣桿.png", audio:"assets/audio/p26.mp3", label:"不鏽鋼伸縮防風曬衣桿"},
    {img:"頁面截圖/026_用撐衣桿把衣服掛高高.png", audio:"assets/audio/p27.mp3", label:"用撐衣桿把衣服掛高高"},
    {img:"頁面截圖/027_衣服曬著太陽暖烘烘.png", audio:"assets/audio/p28.mp3", label:"衣服曬著太陽暖烘烘"},
    {img:"頁面截圖/028_清潔刷.png", audio:"assets/audio/p29.mp3", label:"清潔刷"},
    {img:"頁面截圖/029_人體工學手柄硬毛刷.png", audio:"assets/audio/p30.mp3", label:"人體工學手柄硬毛刷"},
    {img:"頁面截圖/030_用力刷洗地磚縫隙.png", audio:"assets/audio/p31.mp3", label:"用力刷洗地磚縫隙"},
    {img:"頁面截圖/031_地板縫隙刷得亮晶晶.png", audio:"assets/audio/p32.mp3", label:"地板縫隙刷得亮晶晶"},
    {img:"頁面截圖/032_漂白水.png", audio:"assets/audio/p33.mp3", label:"漂白水"},
    {img:"頁面截圖/033_安全瓶蓋含氯漂白水.png", audio:"assets/audio/p34.mp3", label:"安全瓶蓋含氯漂白水"},
    {img:"頁面截圖/034_稀釋消毒居家環境.png", audio:"assets/audio/p35.mp3", label:"稀釋消毒居家環境"},
    {img:"頁面截圖/035_環境消毒遠離病菌.png", audio:"assets/audio/p36.mp3", label:"環境消毒遠離病菌"},
    {img:"頁面截圖/036_玻璃刮刀.png", audio:"assets/audio/p37.mp3", label:"玻璃刮刀"},
    {img:"頁面截圖/037_橡膠刮條玻璃刮水器.png", audio:"assets/audio/p38.mp3", label:"橡膠刮條玻璃刮水器"},
    {img:"頁面截圖/038_一刮水痕立刻消失.png", audio:"assets/audio/p39.mp3", label:"一刮水痕立刻消失"},
    {img:"頁面截圖/039_窗戶乾淨透明像鏡子.png", audio:"assets/audio/p40.mp3", label:"窗戶乾淨透明像鏡子"},
  ];

  let current = 0;
  let audioUnlocked = false;
  let autoPlay = false;
  let autoTimer = null;

  const pageImg = document.getElementById('pageImg');
  const pageCount = document.getElementById('pageCount');
  const dotsWrap = document.getElementById('dots');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const playBtn = document.getElementById('playBtn');
  const autoBtn = document.getElementById('autoBtn');
  const audioPlayer = document.getElementById('audioPlayer');
  const stage = document.querySelector('.stage');
  const frame = document.querySelector('.frame');

  // 讓 16:9 的畫面框在「扣掉頁碼／圓點／按鈕之後剩下的空間」裡盡量放大，
  // 同時保證整頁一定塞得進 100vh，不需要捲動——純 CSS（flex + aspect-ratio）
  // 在直式或接近正方形的視窗下算不準，用 JS 直接量測、算好再賦值最可靠。
  function fitFrame(){
    const ratio = 1.0;
    const availW = stage.clientWidth;
    const availH = stage.clientHeight;
    let w = availW, h = w / ratio;
    if (h > availH){ h = availH; w = h * ratio; }
    frame.style.width = w + 'px';
    frame.style.height = h + 'px';
  }
  window.addEventListener('resize', fitFrame);
  fitFrame();

  pages.forEach((_, i) => {
    const dot = document.createElement('div');
    dot.className = 'dot';
    dot.addEventListener('click', () => goTo(i));
    dotsWrap.appendChild(dot);
  });
  const dotEls = Array.from(dotsWrap.children);

  function updateDots(){
    dotEls.forEach((d,i)=> d.classList.toggle('active', i===current));
  }

  function playCurrentAudio(){
    audioPlayer.currentTime = 0;
    const p = audioPlayer.play();
    if (p !== undefined){
      p.then(()=>{
        audioUnlocked = true;
        playBtn.classList.add('playing');
      }).catch(()=>{
        // 瀏覽器擋自動播放時靜靜失敗即可，按「重複播放」按鈕還是能手動播放
      });
    }
  }


  function updateAutoBtn(){
    autoBtn.classList.toggle('active', autoPlay);
    autoBtn.textContent = autoPlay ? '⏸ 停止自動播放' : '▶ 自動播放';
  }

  function stopAuto(){
    autoPlay = false;
    updateAutoBtn();
    clearTimeout(autoTimer);
  }

  function render(autoplay){
    const page = pages[current];
    pageImg.src = page.img;
    pageImg.alt = page.label;
    pageCount.textContent = (current+1) + ' / ' + pages.length;
    audioPlayer.src = page.audio;
    prevBtn.disabled = current === 0;
    nextBtn.disabled = current === pages.length - 1;
    updateDots();
    playBtn.classList.remove('playing');
    if (autoplay){
      playCurrentAudio();
    }
  }

  function goTo(i){
    if (i<0 || i>=pages.length) return;
    current = i;
    render(true);
  }

  prevBtn.addEventListener('click', ()=> { stopAuto(); goTo(current-1); });
  nextBtn.addEventListener('click', ()=> { stopAuto(); goTo(current+1); });
  playBtn.addEventListener('click', ()=> { audioUnlocked = true; playCurrentAudio(); });
  autoBtn.addEventListener('click', ()=>{
    audioUnlocked = true;
    autoPlay = !autoPlay;
    updateAutoBtn();
    if (autoPlay) playCurrentAudio();
    else clearTimeout(autoTimer);
  });

  audioPlayer.addEventListener('ended', ()=>{
    playBtn.classList.remove('playing');
    if (!autoPlay) return;
    if (current < pages.length - 1){
      autoTimer = setTimeout(()=> goTo(current+1), 700);
    } else {
      stopAuto();
    }
  });

  document.addEventListener('keydown', (e)=>{
    if (e.key === 'ArrowRight'){ stopAuto(); goTo(current+1); }
    else if (e.key === 'ArrowLeft'){ stopAuto(); goTo(current-1); }
    else if (e.key === ' '){ e.preventDefault(); playCurrentAudio(); }
  });

  render(true);
  </script>
</body>
</html>
