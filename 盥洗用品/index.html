<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>盥洗用品｜認知圖卡網站</title>
<link rel="stylesheet" href="../css/site.css">
</head>
<body>

<a class="top-link" href="../index.html">← 返回首頁</a>

<div class="unit-header">
  <h1>🧼 盥洗用品</h1>
  <div class="sub">14盥洗用品（共 10 項）</div>
</div>

<div class="stepper">
  <button class="step-btn" data-step="1"><span class="num">1</span>圖卡認識</button>
  <button class="step-btn" data-step="2"><span class="num">2</span>教學影片</button>
  <button class="step-btn" data-step="3"><span class="num">3</span>造詞造句</button>
  <button class="step-btn" data-step="4"><span class="num">4</span>Wordwall 練習</button>
</div>

<!-- Step 1：圖卡認識 -->
<section class="step-panel" data-step="1">
  <h2 class="panel-title">① 圖卡認識：點卡片聽發音</h2>

  <div class="view-toggle">
    <button class="view-btn" data-view="grid">🔲 全部呈現</button>
    <button class="view-btn" data-view="single">➡️ 逐張瀏覽</button>
  </div>

  <!-- 全部呈現 -->
  <div class="view-panel" data-view="grid">
    <div class="group-heading">盥洗用品</div>
    <div class="card-grid">
      <button class="flash-card" data-audio="14盥洗用品/assets/audio/p01.mp3"><img src="14盥洗用品/頁面截圖/000_牙刷.png" alt="牙刷"><span class="label">牙刷</span></button>
      <button class="flash-card" data-audio="14盥洗用品/assets/audio/p02.mp3"><img src="14盥洗用品/頁面截圖/001_牙膏.png" alt="牙膏"><span class="label">牙膏</span></button>
      <button class="flash-card" data-audio="14盥洗用品/assets/audio/p03.mp3"><img src="14盥洗用品/頁面截圖/002_毛巾.png" alt="毛巾"><span class="label">毛巾</span></button>
      <button class="flash-card" data-audio="14盥洗用品/assets/audio/p04.mp3"><img src="14盥洗用品/頁面截圖/003_肥皂.png" alt="肥皂"><span class="label">肥皂</span></button>
      <button class="flash-card" data-audio="14盥洗用品/assets/audio/p05.mp3"><img src="14盥洗用品/頁面截圖/004_洗髮精.png" alt="洗髮精"><span class="label">洗髮精</span></button>
      <button class="flash-card" data-audio="14盥洗用品/assets/audio/p06.mp3"><img src="14盥洗用品/頁面截圖/005_梳子.png" alt="梳子"><span class="label">梳子</span></button>
      <button class="flash-card" data-audio="14盥洗用品/assets/audio/p07.mp3"><img src="14盥洗用品/頁面截圖/006_面紙.png" alt="面紙"><span class="label">面紙</span></button>
      <button class="flash-card" data-audio="14盥洗用品/assets/audio/p08.mp3"><img src="14盥洗用品/頁面截圖/007_指甲刀.png" alt="指甲刀"><span class="label">指甲刀</span></button>
      <button class="flash-card" data-audio="14盥洗用品/assets/audio/p09.mp3"><img src="14盥洗用品/頁面截圖/008_漱口杯.png" alt="漱口杯"><span class="label">漱口杯</span></button>
      <button class="flash-card" data-audio="14盥洗用品/assets/audio/p10.mp3"><img src="14盥洗用品/頁面截圖/009_洗手乳.png" alt="洗手乳"><span class="label">洗手乳</span></button>
    </div>
  </div>

  <!-- 逐張瀏覽 -->
  <div class="view-panel" data-view="single">
    <div class="single-wrap">
      <div class="single-header">
        <span id="singleGroup">盥洗用品</span>
        <span class="single-count" id="singleCount">1 / 10</span>
      </div>
      <div class="single-frame">
        <img id="singleImg" src="" alt="">
      </div>
      <div class="single-label" id="singleLabel"></div>
      <div class="single-controls">
        <button class="ctrl btn-nav" id="singlePrev" type="button">◀ 上一張</button>
        <button class="ctrl btn-play" id="singlePlay" type="button">🔊 重複播放</button>
        <button class="ctrl btn-auto" id="singleAuto" type="button">▶ 自動播放</button>
        <button class="ctrl btn-nav" id="singleNext" type="button">下一張 ▶</button>
      </div>
    </div>
  </div>

  <audio id="cardAudio" preload="none"></audio>
</section>

<!-- Step 2：教學影片 -->
<section class="step-panel" data-step="2">
  <h2 class="panel-title">② 教學影片：跟著唸讀</h2>
  <div class="link-card-row">
    <a class="link-card" href="14盥洗用品/教材播放器.html">
      <div class="emoji">🎬</div>
      <div class="title">盥洗用品 教學影片</div>
      <div class="desc">牙刷、牙膏、毛巾、肥皂、洗髮精、梳子、面紙、指甲刀、漱口杯、洗手乳</div>
      <div class="go-btn">開始播放</div>
    </a>
  </div>
</section>

<!-- Step 3：造詞造句 -->
<section class="step-panel" data-step="3">
  <h2 class="panel-title">③ 造詞造句：跟著唸讀</h2>
  <div class="link-card-row">
    <a class="link-card" href="14盥洗用品/造詞造句版/教材播放器.html">
      <div class="emoji">📝</div>
      <div class="title">盥洗用品 造詞造句</div>
      <div class="desc">例：牙刷 → 一支牙刷 → 我要用牙刷</div>
      <div class="go-btn">開始練習</div>
    </a>
  </div>
</section>

<!-- Step 4：Wordwall 練習 -->
<section class="step-panel" data-step="4">
  <h2 class="panel-title">④ Wordwall 題庫練習</h2>

  <div class="quiz-group">
    <div class="group-heading">盥洗用品</div>
    <div class="quiz-btns">
      <a class="quiz-btn" target="_blank" rel="noopener" href="https://wordwall.net/tc/resource/117615667"><span class="icon">🃏</span>隨機卡</a>
      <a class="quiz-btn" target="_blank" rel="noopener" href="https://wordwall.net/tc/resource/117615692"><span class="icon">🔎</span>圖片文字匹配</a>
      <a class="quiz-btn" target="_blank" rel="noopener" href="https://wordwall.net/tc/resource/117615705"><span class="icon">🔊</span>只有聲音</a>
      <a class="quiz-btn" target="_blank" rel="noopener" href="https://wordwall.net/tc/resource/117615728"><span class="icon">🖼️</span>圖像測驗</a>
    </div>
  </div>
</section>

<script src="js/unit.js"></script>
</body>
</html>
