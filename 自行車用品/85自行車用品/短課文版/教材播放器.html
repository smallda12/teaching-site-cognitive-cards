<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自行車用品 短課文</title>
<style>
  :root{
    --bg:#FFF6E9;
    --primary:#4A90D9;
    --primary-dark:#3573B5;
    --accent:#FF8C61;
    --accent-dark:#E8703D;
    --text:#3A3A3A;
    --dot:#D8D8D8;
    --dot-active:#4A90D9;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:var(--bg);
    font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
    color:var(--text);
    -webkit-user-select:none;user-select:none;
    overflow:hidden;
  }
  body{
    display:flex;flex-direction:column;
    align-items:center;
    height:100vh;
    padding:1.5vh 16px;
    gap:1.2vh;
  }
  header{
    display:flex;align-items:center;justify-content:center;gap:16px;
    width:100%;
    flex:0 0 auto;
    flex-wrap:wrap;
  }
  h1{
    font-size:clamp(18px,3.2vh,32px);
    margin:0;
  }
  .back-link{
    position:fixed;top:10px;left:12px;
    font-size:clamp(13px,2vh,18px);
    color:var(--primary-dark);
    text-decoration:none;
    background:#fff;
    padding:6px 14px;
    border-radius:999px;
    box-shadow:0 2px 6px rgba(0,0,0,.10);
    z-index:10;
  }
  .back-link:hover{background:var(--bg);}
  .page-count{
    font-size:clamp(14px,2.4vh,24px);
    color:var(--primary-dark);
    font-weight:bold;
    background:#fff;
    padding:4px 16px;
    border-radius:999px;
    box-shadow:0 2px 6px rgba(0,0,0,.10);
  }
  .stage{
    flex:1 1 auto;
    min-height:0;
    width:100%;
    max-width:1100px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .frame{
    max-width:100%;
    max-height:100%;
    background:#000;
    border-radius:28px;
    overflow:hidden;
    box-shadow:0 10px 28px rgba(0,0,0,.20);
    position:relative;
  }
  .frame img{
    width:100%;height:100%;object-fit:contain;
    background:#fff;
    display:block;
  }
  .dots{
    display:flex;gap:7px;flex-wrap:wrap;justify-content:center;
    max-width:900px;
    flex:0 0 auto;
  }
  .dot{
    width:clamp(9px,1.4vh,14px);height:clamp(9px,1.4vh,14px);border-radius:50%;
    background:var(--dot);
    cursor:pointer;
    transition:transform .15s, background .15s;
  }
  .dot.active{background:var(--dot-active);transform:scale(1.35);}
  .controls{
    display:flex;align-items:center;justify-content:center;gap:min(4vw,22px);
    width:100%;
    flex:0 0 auto;
    flex-wrap:wrap;
  }
  button.ctrl{
    border:none;
    border-radius:18px;
    font-size:clamp(15px,2.4vh,24px);
    font-weight:bold;
    padding:1.4vh 20px;
    min-width:110px;
    min-height:clamp(48px,7.5vh,68px);
    cursor:pointer;
    color:#fff;
    box-shadow:0 4px 10px rgba(0,0,0,.15);
    display:flex;align-items:center;justify-content:center;gap:8px;
    transition:transform .1s, opacity .15s, background .15s;
    font-family:inherit;
  }
  button.ctrl:active{transform:scale(.95);}
  button.ctrl:disabled{opacity:.35;cursor:default;}
  .btn-nav{background:var(--primary);}
  .btn-nav:hover:not(:disabled){background:var(--primary-dark);}
  .btn-play{
    background:var(--accent);
    min-width:190px;
    font-size:clamp(16px,2.7vh,26px);
  }
  .btn-play:hover{background:var(--accent-dark);}
  .btn-play.playing{animation:pulse 1s infinite;}
  .btn-auto{background:#4CAF7D;min-width:170px;}
  .btn-auto:hover{background:#3D9468;}
  .btn-auto.active{background:var(--accent-dark);animation:pulse 1s infinite;}
  @keyframes pulse{
    0%,100%{box-shadow:0 4px 10px rgba(0,0,0,.15);}
    50%{box-shadow:0 4px 24px rgba(255,140,97,.7);}
  }
</style>
</head>
<body>
  <a class="back-link" href="../../index.html">← 返回自行車用品單元</a>
  <header>
    <h1>自行車用品 短課文</h1>
    <div class="page-count" id="pageCount">1 / 1</div>
  </header>

  <div class="stage">
    <div class="frame">
      <img id="pageImg" src="" alt="">
    </div>
  </div>

  <div class="dots" id="dots"></div>

  <div class="controls">
    <button class="ctrl btn-nav" id="prevBtn" type="button">◀ 上一頁</button>
    <button class="ctrl btn-play" id="playBtn" type="button">🔊 重複播放</button>
    <button class="ctrl btn-auto" id="autoBtn" type="button">▶ 自動播放</button>
    <button class="ctrl btn-nav" id="nextBtn" type="button">下一頁 ▶</button>
  </div>

  <audio id="audioPlayer" preload="auto"></audio>

  <script>
  const pages = [
    {img:"頁面截圖/000_自行車鎖.png", audio:"assets/audio/p01.mp3", label:"自行車鎖"},
    {img:"頁面截圖/001_這是一個自行車鎖.png", audio:"assets/audio/p02.mp3", label:"這是一個自行車鎖"},
    {img:"頁面截圖/002_自行車鎖可以鎖車.png", audio:"assets/audio/p03.mp3", label:"自行車鎖可以鎖車"},
    {img:"頁面截圖/003_鎖車時套住車輪.png", audio:"assets/audio/p04.mp3", label:"鎖車時套住車輪"},
    {img:"頁面截圖/004_下車後記得鎖車.png", audio:"assets/audio/p05.mp3", label:"下車後記得鎖車"},
    {img:"頁面截圖/005_車鈴.png", audio:"assets/audio/p06.mp3", label:"車鈴"},
    {img:"頁面截圖/006_這是一個車鈴.png", audio:"assets/audio/p07.mp3", label:"這是一個車鈴"},
    {img:"頁面截圖/007_車鈴裝在自行車上.png", audio:"assets/audio/p08.mp3", label:"車鈴裝在自行車上"},
    {img:"頁面截圖/008_按車鈴提醒路人.png", audio:"assets/audio/p09.mp3", label:"按車鈴提醒路人"},
    {img:"頁面截圖/009_需要時按車鈴提醒.png", audio:"assets/audio/p10.mp3", label:"需要時按車鈴提醒"},
    {img:"頁面截圖/010_自行車前燈.png", audio:"assets/audio/p11.mp3", label:"自行車前燈"},
    {img:"頁面截圖/011_這是一盞自行車前燈.png", audio:"assets/audio/p12.mp3", label:"這是一盞自行車前燈"},
    {img:"頁面截圖/012_前燈照亮前方道路.png", audio:"assets/audio/p13.mp3", label:"前燈照亮前方道路"},
    {img:"頁面截圖/013_天暗打開自行車前燈.png", audio:"assets/audio/p14.mp3", label:"天暗打開自行車前燈"},
    {img:"頁面截圖/014_前燈幫我看清路面.png", audio:"assets/audio/p15.mp3", label:"前燈幫我看清路面"},
    {img:"頁面截圖/015_自行車尾燈.png", audio:"assets/audio/p16.mp3", label:"自行車尾燈"},
    {img:"頁面截圖/016_這是一盞自行車尾燈.png", audio:"assets/audio/p17.mp3", label:"這是一盞自行車尾燈"},
    {img:"頁面截圖/017_尾燈發出紅色亮光.png", audio:"assets/audio/p18.mp3", label:"尾燈發出紅色亮光"},
    {img:"頁面截圖/018_天暗騎車要開尾燈.png", audio:"assets/audio/p19.mp3", label:"天暗騎車要開尾燈"},
    {img:"頁面截圖/019_後方的人更容易看見.png", audio:"assets/audio/p20.mp3", label:"後方的人更容易看見"},
    {img:"頁面截圖/020_打氣筒.png", audio:"assets/audio/p21.mp3", label:"打氣筒"},
    {img:"頁面截圖/021_這是一支打氣筒.png", audio:"assets/audio/p22.mp3", label:"這是一支打氣筒"},
    {img:"頁面截圖/022_打氣筒有長長的管子.png", audio:"assets/audio/p23.mp3", label:"打氣筒有長長的管子"},
    {img:"頁面截圖/023_把氣打進自行車輪胎.png", audio:"assets/audio/p24.mp3", label:"把氣打進自行車輪胎"},
    {img:"頁面截圖/024_輪胎有氣比較好騎.png", audio:"assets/audio/p25.mp3", label:"輪胎有氣比較好騎"},
    {img:"頁面截圖/025_自行車碼表.png", audio:"assets/audio/p26.mp3", label:"自行車碼表"},
    {img:"頁面截圖/026_這是一台自行車碼表.png", audio:"assets/audio/p27.mp3", label:"這是一台自行車碼表"},
    {img:"頁面截圖/027_碼表顯示騎車資料.png", audio:"assets/audio/p28.mp3", label:"碼表顯示騎車資料"},
    {img:"頁面截圖/028_騎車時查看速度.png", audio:"assets/audio/p29.mp3", label:"騎車時查看速度"},
    {img:"頁面截圖/029_停車後看看騎多遠.png", audio:"assets/audio/p30.mp3", label:"停車後看看騎多遠"},
    {img:"頁面截圖/030_水壺架.png", audio:"assets/audio/p31.mp3", label:"水壺架"},
    {img:"頁面截圖/031_這是一個水壺架.png", audio:"assets/audio/p32.mp3", label:"這是一個水壺架"},
    {img:"頁面截圖/032_水壺架固定在自行車上.png", audio:"assets/audio/p33.mp3", label:"水壺架固定在自行車上"},
    {img:"頁面截圖/033_把水壺放進水壺架.png", audio:"assets/audio/p34.mp3", label:"把水壺放進水壺架"},
    {img:"頁面截圖/034_騎車中途拿水喝.png", audio:"assets/audio/p35.mp3", label:"騎車中途拿水喝"},
    {img:"頁面截圖/035_自行車腳架.png", audio:"assets/audio/p36.mp3", label:"自行車腳架"},
    {img:"頁面截圖/036_這是一支自行車腳架.png", audio:"assets/audio/p37.mp3", label:"這是一支自行車腳架"},
    {img:"頁面截圖/037_腳架撐住停好的車.png", audio:"assets/audio/p38.mp3", label:"腳架撐住停好的車"},
    {img:"頁面截圖/038_停車時放下腳架.png", audio:"assets/audio/p39.mp3", label:"停車時放下腳架"},
    {img:"頁面截圖/039_腳架讓車子站穩.png", audio:"assets/audio/p40.mp3", label:"腳架讓車子站穩"},
    {img:"頁面截圖/040_自行車籃.png", audio:"assets/audio/p41.mp3", label:"自行車籃"},
    {img:"頁面截圖/041_這是一個自行車籃.png", audio:"assets/audio/p42.mp3", label:"這是一個自行車籃"},
    {img:"頁面截圖/042_自行車籃可以放東西.png", audio:"assets/audio/p43.mp3", label:"自行車籃可以放東西"},
    {img:"頁面截圖/043_把書包放進車籃裡.png", audio:"assets/audio/p44.mp3", label:"把書包放進車籃裡"},
    {img:"頁面截圖/044_騎車前確認東西放好.png", audio:"assets/audio/p45.mp3", label:"騎車前確認東西放好"},
    {img:"頁面截圖/045_自行車坐墊.png", audio:"assets/audio/p46.mp3", label:"自行車坐墊"},
    {img:"頁面截圖/046_這是一個自行車坐墊.png", audio:"assets/audio/p47.mp3", label:"這是一個自行車坐墊"},
    {img:"頁面截圖/047_坐墊長長又有厚度.png", audio:"assets/audio/p48.mp3", label:"坐墊長長又有厚度"},
    {img:"頁面截圖/048_騎車時坐在坐墊上.png", audio:"assets/audio/p49.mp3", label:"騎車時坐在坐墊上"},
    {img:"頁面截圖/049_調好高度再開始騎.png", audio:"assets/audio/p50.mp3", label:"調好高度再開始騎"},
  ];

  let current = 0;
  let audioUnlocked = false;
  let autoPlay = false;
  let autoTimer = null;

  const pageImg = document.getElementById('pageImg');
  const pageCount = document.getElementById('pageCount');
  const dotsWrap = document.getElementById('dots');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const playBtn = document.getElementById('playBtn');
  const autoBtn = document.getElementById('autoBtn');
  const audioPlayer = document.getElementById('audioPlayer');
  const stage = document.querySelector('.stage');
  const frame = document.querySelector('.frame');

  // 讓 16:9 的畫面框在「扣掉頁碼／圓點／按鈕之後剩下的空間」裡盡量放大，
  // 同時保證整頁一定塞得進 100vh，不需要捲動——純 CSS（flex + aspect-ratio）
  // 在直式或接近正方形的視窗下算不準，用 JS 直接量測、算好再賦值最可靠。
  function fitFrame(){
    const ratio = 1.0;
    const availW = stage.clientWidth;
    const availH = stage.clientHeight;
    let w = availW, h = w / ratio;
    if (h > availH){ h = availH; w = h * ratio; }
    frame.style.width = w + 'px';
    frame.style.height = h + 'px';
  }
  window.addEventListener('resize', fitFrame);
  fitFrame();

  pages.forEach((_, i) => {
    const dot = document.createElement('div');
    dot.className = 'dot';
    dot.addEventListener('click', () => goTo(i));
    dotsWrap.appendChild(dot);
  });
  const dotEls = Array.from(dotsWrap.children);

  function updateDots(){
    dotEls.forEach((d,i)=> d.classList.toggle('active', i===current));
  }

  function playCurrentAudio(){
    audioPlayer.currentTime = 0;
    const p = audioPlayer.play();
    if (p !== undefined){
      p.then(()=>{
        audioUnlocked = true;
        playBtn.classList.add('playing');
      }).catch(()=>{
        // 瀏覽器擋自動播放時靜靜失敗即可，按「重複播放」按鈕還是能手動播放
      });
    }
  }


  function updateAutoBtn(){
    autoBtn.classList.toggle('active', autoPlay);
    autoBtn.textContent = autoPlay ? '⏸ 停止自動播放' : '▶ 自動播放';
  }

  function stopAuto(){
    autoPlay = false;
    updateAutoBtn();
    clearTimeout(autoTimer);
  }

  function render(autoplay){
    const page = pages[current];
    pageImg.src = page.img;
    pageImg.alt = page.label;
    pageCount.textContent = (current+1) + ' / ' + pages.length;
    audioPlayer.src = page.audio;
    prevBtn.disabled = current === 0;
    nextBtn.disabled = current === pages.length - 1;
    updateDots();
    playBtn.classList.remove('playing');
    if (autoplay){
      playCurrentAudio();
    }
  }

  function goTo(i){
    if (i<0 || i>=pages.length) return;
    current = i;
    render(true);
  }

  prevBtn.addEventListener('click', ()=> { stopAuto(); goTo(current-1); });
  nextBtn.addEventListener('click', ()=> { stopAuto(); goTo(current+1); });
  playBtn.addEventListener('click', ()=> { audioUnlocked = true; playCurrentAudio(); });
  autoBtn.addEventListener('click', ()=>{
    audioUnlocked = true;
    autoPlay = !autoPlay;
    updateAutoBtn();
    if (autoPlay) playCurrentAudio();
    else clearTimeout(autoTimer);
  });

  audioPlayer.addEventListener('ended', ()=>{
    playBtn.classList.remove('playing');
    if (!autoPlay) return;
    if (current < pages.length - 1){
      autoTimer = setTimeout(()=> goTo(current+1), 700);
    } else {
      stopAuto();
    }
  });

  document.addEventListener('keydown', (e)=>{
    if (e.key === 'ArrowRight'){ stopAuto(); goTo(current+1); }
    else if (e.key === 'ArrowLeft'){ stopAuto(); goTo(current-1); }
    else if (e.key === ' '){ e.preventDefault(); playCurrentAudio(); }
  });

  render(true);
  </script>
</body>
</html>
