<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>園藝農具｜認知圖卡網站</title>
<link rel="stylesheet" href="../css/site.css">
</head>
<body>

<a class="top-link" href="../index.html">← 返回首頁</a>

<div class="unit-header">
  <h1>🌱 園藝農具</h1>
  <div class="sub">68園藝農具（共 10 項）</div>
</div>

<div class="stepper">
  <button class="step-btn" data-step="1"><span class="num">1</span>圖卡認識</button>
  <button class="step-btn" data-step="2"><span class="num">2</span>教學影片</button>
  <button class="step-btn" data-step="3"><span class="num">3</span>造詞造句</button>
  <button class="step-btn" data-step="4"><span class="num">4</span>Wordwall 練習</button>
</div>

<!-- Step 1：圖卡認識 -->
<section class="step-panel" data-step="1">
  <h2 class="panel-title">① 圖卡認識：點卡片聽發音</h2>

  <div class="view-toggle">
    <button class="view-btn" data-view="grid">🔲 全部呈現</button>
    <button class="view-btn" data-view="single">➡️ 逐張瀏覽</button>
  </div>

  <div class="view-panel" data-view="grid">
    <div class="group-heading">園藝農具</div>
    <div class="card-grid">
      <button class="flash-card" data-audio="68園藝農具/assets/audio/p01.mp3"><img src="68園藝農具/頁面截圖/000_花盆.png" alt="花盆"><span class="label">花盆</span></button>
      <button class="flash-card" data-audio="68園藝農具/assets/audio/p02.mp3"><img src="68園藝農具/頁面截圖/001_鋤頭.png" alt="鋤頭"><span class="label">鋤頭</span></button>
      <button class="flash-card" data-audio="68園藝農具/assets/audio/p03.mp3"><img src="68園藝農具/頁面截圖/002_鐮刀.png" alt="鐮刀"><span class="label">鐮刀</span></button>
      <button class="flash-card" data-audio="68園藝農具/assets/audio/p04.mp3"><img src="68園藝農具/頁面截圖/003_鐵耙.png" alt="鐵耙"><span class="label">鐵耙</span></button>
      <button class="flash-card" data-audio="68園藝農具/assets/audio/p05.mp3"><img src="68園藝農具/頁面截圖/004_手推車.png" alt="手推車"><span class="label">手推車</span></button>
      <button class="flash-card" data-audio="68園藝農具/assets/audio/p06.mp3"><img src="68園藝農具/頁面截圖/005_割草機.png" alt="割草機"><span class="label">割草機</span></button>
      <button class="flash-card" data-audio="68園藝農具/assets/audio/p07.mp3"><img src="68園藝農具/頁面截圖/006_水管.png" alt="水管"><span class="label">水管</span></button>
      <button class="flash-card" data-audio="68園藝農具/assets/audio/p08.mp3"><img src="68園藝農具/頁面截圖/007_稻草人.png" alt="稻草人"><span class="label">稻草人</span></button>
      <button class="flash-card" data-audio="68園藝農具/assets/audio/p09.mp3"><img src="68園藝農具/頁面截圖/008_澆花壺.png" alt="澆花壺"><span class="label">澆花壺</span></button>
      <button class="flash-card" data-audio="68園藝農具/assets/audio/p10.mp3"><img src="68園藝農具/頁面截圖/009_灑水器.png" alt="灑水器"><span class="label">灑水器</span></button>
    </div>
  </div>

  <div class="view-panel" data-view="single">
    <div class="single-wrap">
      <div class="single-header">
        <span id="singleGroup">園藝農具</span>
        <span class="single-count" id="singleCount">1 / 10</span>
      </div>
      <div class="single-frame">
        <img id="singleImg" src="" alt="">
      </div>
      <div class="single-label" id="singleLabel"></div>
      <div class="single-controls">
        <button class="ctrl btn-nav" id="singlePrev" type="button">◀ 上一張</button>
        <button class="ctrl btn-play" id="singlePlay" type="button">🔊 重複播放</button>
        <button class="ctrl btn-auto" id="singleAuto" type="button">▶ 自動播放</button>
        <button class="ctrl btn-nav" id="singleNext" type="button">下一張 ▶</button>
      </div>
    </div>
  </div>

  <audio id="cardAudio" preload="none"></audio>
</section>

<!-- Step 2：教學影片 -->
<section class="step-panel" data-step="2">
  <h2 class="panel-title">② 教學影片：跟著唸讀</h2>
  <div class="link-card-row">
    <a class="link-card" href="68園藝農具/教材播放器.html">
      <div class="emoji">🎬</div>
      <div class="title">園藝農具 教學影片</div>
      <div class="desc">花盆、鋤頭、鐮刀、鐵耙、手推車、割草機、水管、稻草人、澆花壺、灑水器</div>
      <div class="go-btn">開始播放</div>
    </a>
  </div>
</section>

<!-- Step 3：造詞造句 -->
<section class="step-panel" data-step="3">
  <h2 class="panel-title">③ 造詞造句：跟著唸讀</h2>
  <div class="link-card-row">
    <a class="link-card" href="68園藝農具/造詞造句版/教材播放器.html">
      <div class="emoji">📝</div>
      <div class="title">園藝農具 造詞造句</div>
      <div class="desc">例：花盆 → 搬花盆 → 我要搬花盆</div>
      <div class="go-btn">開始練習</div>
    </a>
  </div>
</section>

<!-- Step 4：Wordwall 練習 -->
<section class="step-panel" data-step="4">
  <h2 class="panel-title">④ Wordwall 題庫練習</h2>

  <div class="quiz-group">
    <div class="group-heading">園藝農具</div>
    <div class="quiz-btns">
      <a class="quiz-btn" target="_blank" rel="noopener" href="https://wordwall.net/tc/resource/118622606"><span class="icon">🃏</span>隨機卡</a>
      <a class="quiz-btn" target="_blank" rel="noopener" href="https://wordwall.net/tc/resource/118622642"><span class="icon">🔎</span>圖片文字匹配</a>
      <a class="quiz-btn" target="_blank" rel="noopener" href="https://wordwall.net/tc/resource/118622670"><span class="icon">🔊</span>只有聲音</a>
      <a class="quiz-btn" target="_blank" rel="noopener" href="https://wordwall.net/tc/resource/118622702"><span class="icon">🖼️</span>圖像測驗</a>
    </div>
  </div>
</section>

<script src="js/unit.js"></script>
</body>
</html>
