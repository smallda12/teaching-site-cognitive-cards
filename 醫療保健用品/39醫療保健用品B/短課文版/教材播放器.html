<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>醫療保健用品 B 短課文</title>
<style>
  :root{
    --bg:#FFF6E9;
    --primary:#4A90D9;
    --primary-dark:#3573B5;
    --accent:#FF8C61;
    --accent-dark:#E8703D;
    --text:#3A3A3A;
    --dot:#D8D8D8;
    --dot-active:#4A90D9;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:var(--bg);
    font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
    color:var(--text);
    -webkit-user-select:none;user-select:none;
    overflow:hidden;
  }
  body{
    display:flex;flex-direction:column;
    align-items:center;
    height:100vh;
    padding:1.5vh 16px;
    gap:1.2vh;
  }
  header{
    display:flex;align-items:center;justify-content:center;gap:16px;
    width:100%;
    flex:0 0 auto;
    flex-wrap:wrap;
  }
  h1{
    font-size:clamp(18px,3.2vh,32px);
    margin:0;
  }
  .back-link{
    position:fixed;top:10px;left:12px;
    font-size:clamp(13px,2vh,18px);
    color:var(--primary-dark);
    text-decoration:none;
    background:#fff;
    padding:6px 14px;
    border-radius:999px;
    box-shadow:0 2px 6px rgba(0,0,0,.10);
    z-index:10;
  }
  .back-link:hover{background:var(--bg);}
  .page-count{
    font-size:clamp(14px,2.4vh,24px);
    color:var(--primary-dark);
    font-weight:bold;
    background:#fff;
    padding:4px 16px;
    border-radius:999px;
    box-shadow:0 2px 6px rgba(0,0,0,.10);
  }
  .stage{
    flex:1 1 auto;
    min-height:0;
    width:100%;
    max-width:1100px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .frame{
    max-width:100%;
    max-height:100%;
    background:#000;
    border-radius:28px;
    overflow:hidden;
    box-shadow:0 10px 28px rgba(0,0,0,.20);
    position:relative;
  }
  .frame img{
    width:100%;height:100%;object-fit:contain;
    background:#fff;
    display:block;
  }
  .dots{
    display:flex;gap:7px;flex-wrap:wrap;justify-content:center;
    max-width:900px;
    flex:0 0 auto;
  }
  .dot{
    width:clamp(9px,1.4vh,14px);height:clamp(9px,1.4vh,14px);border-radius:50%;
    background:var(--dot);
    cursor:pointer;
    transition:transform .15s, background .15s;
  }
  .dot.active{background:var(--dot-active);transform:scale(1.35);}
  .controls{
    display:flex;align-items:center;justify-content:center;gap:min(4vw,22px);
    width:100%;
    flex:0 0 auto;
    flex-wrap:wrap;
  }
  button.ctrl{
    border:none;
    border-radius:18px;
    font-size:clamp(15px,2.4vh,24px);
    font-weight:bold;
    padding:1.4vh 20px;
    min-width:110px;
    min-height:clamp(48px,7.5vh,68px);
    cursor:pointer;
    color:#fff;
    box-shadow:0 4px 10px rgba(0,0,0,.15);
    display:flex;align-items:center;justify-content:center;gap:8px;
    transition:transform .1s, opacity .15s, background .15s;
    font-family:inherit;
  }
  button.ctrl:active{transform:scale(.95);}
  button.ctrl:disabled{opacity:.35;cursor:default;}
  .btn-nav{background:var(--primary);}
  .btn-nav:hover:not(:disabled){background:var(--primary-dark);}
  .btn-play{
    background:var(--accent);
    min-width:190px;
    font-size:clamp(16px,2.7vh,26px);
  }
  .btn-play:hover{background:var(--accent-dark);}
  .btn-play.playing{animation:pulse 1s infinite;}
  .btn-auto{background:#4CAF7D;min-width:170px;}
  .btn-auto:hover{background:#3D9468;}
  .btn-auto.active{background:var(--accent-dark);animation:pulse 1s infinite;}
  @keyframes pulse{
    0%,100%{box-shadow:0 4px 10px rgba(0,0,0,.15);}
    50%{box-shadow:0 4px 24px rgba(255,140,97,.7);}
  }
</style>
</head>
<body>
  <a class="back-link" href="../../index.html">← 返回醫療保健用品單元</a>
  <header>
    <h1>醫療保健用品 B 短課文</h1>
    <div class="page-count" id="pageCount">1 / 1</div>
  </header>

  <div class="stage">
    <div class="frame">
      <img id="pageImg" src="" alt="">
    </div>
  </div>

  <div class="dots" id="dots"></div>

  <div class="controls">
    <button class="ctrl btn-nav" id="prevBtn" type="button">◀ 上一頁</button>
    <button class="ctrl btn-play" id="playBtn" type="button">🔊 重複播放</button>
    <button class="ctrl btn-auto" id="autoBtn" type="button">▶ 自動播放</button>
    <button class="ctrl btn-nav" id="nextBtn" type="button">下一頁 ▶</button>
  </div>

  <audio id="audioPlayer" preload="auto"></audio>

  <script>
  const pages = [
    {img:"頁面截圖/000_輪椅.png", audio:"assets/audio/p01.mp3", label:"輪椅"},
    {img:"頁面截圖/001_這是一台大輪椅.png", audio:"assets/audio/p02.mp3", label:"這是一台大輪椅"},
    {img:"頁面截圖/002_大大輪子好推動.png", audio:"assets/audio/p03.mp3", label:"大大輪子好推動"},
    {img:"頁面截圖/003_坐上輪椅推著走.png", audio:"assets/audio/p04.mp3", label:"坐上輪椅推著走"},
    {img:"頁面截圖/004_護理師推輪椅帶我走.png", audio:"assets/audio/p05.mp3", label:"護理師推輪椅帶我走"},
    {img:"頁面截圖/005_拐杖.png", audio:"assets/audio/p06.mp3", label:"拐杖"},
    {img:"頁面截圖/006_這是一支輕拐杖.png", audio:"assets/audio/p07.mp3", label:"這是一支輕拐杖"},
    {img:"頁面截圖/007_防滑腳墊好支撐.png", audio:"assets/audio/p08.mp3", label:"防滑腳墊好支撐"},
    {img:"頁面截圖/008_拄著拐杖慢慢走.png", audio:"assets/audio/p09.mp3", label:"拄著拐杖慢慢走"},
    {img:"頁面截圖/009_我扶著拐杖一步一步走.png", audio:"assets/audio/p10.mp3", label:"我扶著拐杖一步一步走"},
    {img:"頁面截圖/010_聽診器.png", audio:"assets/audio/p11.mp3", label:"聽診器"},
    {img:"頁面截圖/011_這是一支聽診器.png", audio:"assets/audio/p12.mp3", label:"這是一支聽診器"},
    {img:"頁面截圖/012_圓圓聽頭聽心跳.png", audio:"assets/audio/p13.mp3", label:"圓圓聽頭聽心跳"},
    {img:"頁面截圖/013_撲通撲通聽聲音.png", audio:"assets/audio/p14.mp3", label:"撲通撲通聽聲音"},
    {img:"頁面截圖/014_護理師幫我聽心跳.png", audio:"assets/audio/p15.mp3", label:"護理師幫我聽心跳"},
    {img:"頁面截圖/015_血壓計.png", audio:"assets/audio/p16.mp3", label:"血壓計"},
    {img:"頁面截圖/016_這是一台血壓計.png", audio:"assets/audio/p17.mp3", label:"這是一台血壓計"},
    {img:"頁面截圖/017_壓脈帶綁手臂.png", audio:"assets/audio/p18.mp3", label:"壓脈帶綁手臂"},
    {img:"頁面截圖/018_充氣量量高血壓.png", audio:"assets/audio/p19.mp3", label:"充氣量量高血壓"},
    {img:"頁面截圖/019_護理師幫我量血壓.png", audio:"assets/audio/p20.mp3", label:"護理師幫我量血壓"},
    {img:"頁面截圖/020_血氧機.png", audio:"assets/audio/p21.mp3", label:"血氧機"},
    {img:"頁面截圖/021_這是一台血氧機.png", audio:"assets/audio/p22.mp3", label:"這是一台血氧機"},
    {img:"頁面截圖/022_夾在手指測血氧.png", audio:"assets/audio/p23.mp3", label:"夾在手指測血氧"},
    {img:"頁面截圖/023_螢幕顯示紅數字.png", audio:"assets/audio/p24.mp3", label:"螢幕顯示紅數字"},
    {img:"頁面截圖/024_護理師夾我手指測血氧.png", audio:"assets/audio/p25.mp3", label:"護理師夾我手指測血氧"},
    {img:"頁面截圖/025_助聽器.png", audio:"assets/audio/p26.mp3", label:"助聽器"},
    {img:"頁面截圖/026_這是一個助聽器.png", audio:"assets/audio/p27.mp3", label:"這是一個助聽器"},
    {img:"頁面截圖/027_小小機器戴耳朵.png", audio:"assets/audio/p28.mp3", label:"小小機器戴耳朵"},
    {img:"頁面截圖/028_放大聲音聽清楚.png", audio:"assets/audio/p29.mp3", label:"放大聲音聽清楚"},
    {img:"頁面截圖/029_我戴上助聽器聽聲音.png", audio:"assets/audio/p30.mp3", label:"我戴上助聽器聽聲音"},
    {img:"頁面截圖/030_眼鏡.png", audio:"assets/audio/p31.mp3", label:"眼鏡"},
    {img:"頁面截圖/031_這是一副大眼鏡.png", audio:"assets/audio/p32.mp3", label:"這是一副大眼鏡"},
    {img:"頁面截圖/032_透明鏡片看清楚.png", audio:"assets/audio/p33.mp3", label:"透明鏡片看清楚"},
    {img:"頁面截圖/033_戴上眼鏡看黑板.png", audio:"assets/audio/p34.mp3", label:"戴上眼鏡看黑板"},
    {img:"頁面截圖/034_我戴上眼鏡看黑板字.png", audio:"assets/audio/p35.mp3", label:"我戴上眼鏡看黑板字"},
    {img:"頁面截圖/035_急救箱.png", audio:"assets/audio/p36.mp3", label:"急救箱"},
    {img:"頁面截圖/036_這是一個急救箱.png", audio:"assets/audio/p37.mp3", label:"這是一個急救箱"},
    {img:"頁面截圖/037_紅色十字好辨識.png", audio:"assets/audio/p38.mp3", label:"紅色十字好辨識"},
    {img:"頁面截圖/038_裝滿急救小藥品.png", audio:"assets/audio/p39.mp3", label:"裝滿急救小藥品"},
    {img:"頁面截圖/039_護理師提著急救箱幫忙.png", audio:"assets/audio/p40.mp3", label:"護理師提著急救箱幫忙"},
    {img:"頁面截圖/040_冰枕.png", audio:"assets/audio/p41.mp3", label:"冰枕"},
    {img:"頁面截圖/041_這是一個涼冰枕.png", audio:"assets/audio/p42.mp3", label:"這是一個涼冰枕"},
    {img:"頁面截圖/042_藍色冰枕好冰涼.png", audio:"assets/audio/p43.mp3", label:"藍色冰枕好冰涼"},
    {img:"頁面截圖/043_發燒躺著退退燒.png", audio:"assets/audio/p44.mp3", label:"發燒躺著退退燒"},
    {img:"頁面截圖/044_我枕著冰枕閉眼休息.png", audio:"assets/audio/p45.mp3", label:"我枕著冰枕閉眼休息"},
    {img:"頁面截圖/045_護膝.png", audio:"assets/audio/p46.mp3", label:"護膝"},
    {img:"頁面截圖/046_這是一雙彈性護膝.png", audio:"assets/audio/p47.mp3", label:"這是一雙彈性護膝"},
    {img:"頁面截圖/047_黑色護膝包膝蓋.png", audio:"assets/audio/p48.mp3", label:"黑色護膝包膝蓋"},
    {img:"頁面截圖/048_跑步運動不摔傷.png", audio:"assets/audio/p49.mp3", label:"跑步運動不摔傷"},
    {img:"頁面截圖/049_我戴上護膝去運動.png", audio:"assets/audio/p50.mp3", label:"我戴上護膝去運動"},
  ];

  let current = 0;
  let audioUnlocked = false;
  let autoPlay = false;
  let autoTimer = null;

  const pageImg = document.getElementById('pageImg');
  const pageCount = document.getElementById('pageCount');
  const dotsWrap = document.getElementById('dots');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const playBtn = document.getElementById('playBtn');
  const autoBtn = document.getElementById('autoBtn');
  const audioPlayer = document.getElementById('audioPlayer');
  const stage = document.querySelector('.stage');
  const frame = document.querySelector('.frame');

  // 讓 16:9 的畫面框在「扣掉頁碼／圓點／按鈕之後剩下的空間」裡盡量放大，
  // 同時保證整頁一定塞得進 100vh，不需要捲動——純 CSS（flex + aspect-ratio）
  // 在直式或接近正方形的視窗下算不準，用 JS 直接量測、算好再賦值最可靠。
  function fitFrame(){
    const ratio = 1.0;
    const availW = stage.clientWidth;
    const availH = stage.clientHeight;
    let w = availW, h = w / ratio;
    if (h > availH){ h = availH; w = h * ratio; }
    frame.style.width = w + 'px';
    frame.style.height = h + 'px';
  }
  window.addEventListener('resize', fitFrame);
  fitFrame();

  pages.forEach((_, i) => {
    const dot = document.createElement('div');
    dot.className = 'dot';
    dot.addEventListener('click', () => goTo(i));
    dotsWrap.appendChild(dot);
  });
  const dotEls = Array.from(dotsWrap.children);

  function updateDots(){
    dotEls.forEach((d,i)=> d.classList.toggle('active', i===current));
  }

  function playCurrentAudio(){
    audioPlayer.currentTime = 0;
    const p = audioPlayer.play();
    if (p !== undefined){
      p.then(()=>{
        audioUnlocked = true;
        playBtn.classList.add('playing');
      }).catch(()=>{
        // 瀏覽器擋自動播放時靜靜失敗即可，按「重複播放」按鈕還是能手動播放
      });
    }
  }


  function updateAutoBtn(){
    autoBtn.classList.toggle('active', autoPlay);
    autoBtn.textContent = autoPlay ? '⏸ 停止自動播放' : '▶ 自動播放';
  }

  function stopAuto(){
    autoPlay = false;
    updateAutoBtn();
    clearTimeout(autoTimer);
  }

  function render(autoplay){
    const page = pages[current];
    pageImg.src = page.img;
    pageImg.alt = page.label;
    pageCount.textContent = (current+1) + ' / ' + pages.length;
    audioPlayer.src = page.audio;
    prevBtn.disabled = current === 0;
    nextBtn.disabled = current === pages.length - 1;
    updateDots();
    playBtn.classList.remove('playing');
    if (autoplay){
      playCurrentAudio();
    }
  }

  function goTo(i){
    if (i<0 || i>=pages.length) return;
    current = i;
    render(true);
  }

  prevBtn.addEventListener('click', ()=> { stopAuto(); goTo(current-1); });
  nextBtn.addEventListener('click', ()=> { stopAuto(); goTo(current+1); });
  playBtn.addEventListener('click', ()=> { audioUnlocked = true; playCurrentAudio(); });
  autoBtn.addEventListener('click', ()=>{
    audioUnlocked = true;
    autoPlay = !autoPlay;
    updateAutoBtn();
    if (autoPlay) playCurrentAudio();
    else clearTimeout(autoTimer);
  });

  audioPlayer.addEventListener('ended', ()=>{
    playBtn.classList.remove('playing');
    if (!autoPlay) return;
    if (current < pages.length - 1){
      autoTimer = setTimeout(()=> goTo(current+1), 700);
    } else {
      stopAuto();
    }
  });

  document.addEventListener('keydown', (e)=>{
    if (e.key === 'ArrowRight'){ stopAuto(); goTo(current+1); }
    else if (e.key === 'ArrowLeft'){ stopAuto(); goTo(current-1); }
    else if (e.key === ' '){ e.preventDefault(); playCurrentAudio(); }
  });

  render(true);
  </script>
</body>
</html>
