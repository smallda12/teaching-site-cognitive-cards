<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>交通標誌｜認知圖卡網站</title>
<link rel="stylesheet" href="../css/site.css">
</head>
<body>

<a class="top-link" href="../index.html">← 返回首頁</a>

<div class="unit-header">
  <h1>🚸 交通標誌</h1>
  <div class="sub">71交通標誌（共 10 項）</div>
</div>

<div class="stepper">
  <button class="step-btn" data-step="1"><span class="num">1</span>圖卡認識</button>
  <button class="step-btn" data-step="2"><span class="num">2</span>教學影片</button>
  <button class="step-btn" data-step="3"><span class="num">3</span>造詞造句</button>
  <button class="step-btn" data-step="4"><span class="num">4</span>Wordwall 練習</button>
</div>

<!-- Step 1：圖卡認識 -->
<section class="step-panel" data-step="1">
  <h2 class="panel-title">① 圖卡認識：點卡片聽發音</h2>

  <div class="view-toggle">
    <button class="view-btn" data-view="grid">🔲 全部呈現</button>
    <button class="view-btn" data-view="single">➡️ 逐張瀏覽</button>
  </div>

  <div class="view-panel" data-view="grid">
    <div class="group-heading">交通標誌</div>
    <div class="card-grid">
      <button class="flash-card" data-audio="71交通標誌/assets/audio/p01.mp3"><img src="71交通標誌/頁面截圖/000_停止標誌.png" alt="停止標誌"><span class="label">停止標誌</span></button>
      <button class="flash-card" data-audio="71交通標誌/assets/audio/p02.mp3"><img src="71交通標誌/頁面截圖/001_讓路標誌.png" alt="讓路標誌"><span class="label">讓路標誌</span></button>
      <button class="flash-card" data-audio="71交通標誌/assets/audio/p03.mp3"><img src="71交通標誌/頁面截圖/002_禁止進入標誌.png" alt="禁止進入標誌"><span class="label">禁止進入標誌</span></button>
      <button class="flash-card" data-audio="71交通標誌/assets/audio/p04.mp3"><img src="71交通標誌/頁面截圖/003_行人穿越標誌.png" alt="行人穿越標誌"><span class="label">行人穿越標誌</span></button>
      <button class="flash-card" data-audio="71交通標誌/assets/audio/p05.mp3"><img src="71交通標誌/頁面截圖/004_限速標誌.png" alt="限速標誌"><span class="label">限速標誌</span></button>
      <button class="flash-card" data-audio="71交通標誌/assets/audio/p06.mp3"><img src="71交通標誌/頁面截圖/005_禁止停車標誌.png" alt="禁止停車標誌"><span class="label">禁止停車標誌</span></button>
      <button class="flash-card" data-audio="71交通標誌/assets/audio/p07.mp3"><img src="71交通標誌/頁面截圖/006_單行道標誌.png" alt="單行道標誌"><span class="label">單行道標誌</span></button>
      <button class="flash-card" data-audio="71交通標誌/assets/audio/p08.mp3"><img src="71交通標誌/頁面截圖/007_彎道標誌.png" alt="彎道標誌"><span class="label">彎道標誌</span></button>
      <button class="flash-card" data-audio="71交通標誌/assets/audio/p09.mp3"><img src="71交通標誌/頁面截圖/008_當心兒童標誌.png" alt="當心兒童標誌"><span class="label">當心兒童標誌</span></button>
      <button class="flash-card" data-audio="71交通標誌/assets/audio/p10.mp3"><img src="71交通標誌/頁面截圖/009_無障礙標誌.png" alt="無障礙標誌"><span class="label">無障礙標誌</span></button>
    </div>
  </div>

  <div class="view-panel" data-view="single">
    <div class="single-wrap">
      <div class="single-header">
        <span id="singleGroup">交通標誌</span>
        <span class="single-count" id="singleCount">1 / 10</span>
      </div>
      <div class="single-frame">
        <img id="singleImg" src="" alt="">
      </div>
      <div class="single-label" id="singleLabel"></div>
      <div class="single-controls">
        <button class="ctrl btn-nav" id="singlePrev" type="button">◀ 上一張</button>
        <button class="ctrl btn-play" id="singlePlay" type="button">🔊 重複播放</button>
        <button class="ctrl btn-auto" id="singleAuto" type="button">▶ 自動播放</button>
        <button class="ctrl btn-nav" id="singleNext" type="button">下一張 ▶</button>
      </div>
    </div>
  </div>

  <audio id="cardAudio" preload="none"></audio>
</section>

<!-- Step 2：教學影片 -->
<section class="step-panel" data-step="2">
  <h2 class="panel-title">② 教學影片：跟著唸讀</h2>
  <div class="link-card-row">
    <a class="link-card" href="71交通標誌/教材播放器.html">
      <div class="emoji">🎬</div>
      <div class="title">交通標誌 教學影片</div>
      <div class="desc">停止標誌、讓路標誌、禁止進入標誌、行人穿越標誌、限速標誌、禁止停車標誌、單行道標誌、彎道標誌、當心兒童標誌、無障礙標誌</div>
      <div class="go-btn">開始播放</div>
    </a>
  </div>
</section>

<!-- Step 3：造詞造句 -->
<section class="step-panel" data-step="3">
  <h2 class="panel-title">③ 造詞造句：跟著唸讀</h2>
  <div class="link-card-row">
    <a class="link-card" href="71交通標誌/造詞造句版/教材播放器.html">
      <div class="emoji">📝</div>
      <div class="title">交通標誌 造詞造句</div>
      <div class="desc">例：停止標誌 → 看停止標誌 → 我看到停止標誌</div>
      <div class="go-btn">開始練習</div>
    </a>
  </div>
</section>

<!-- Step 4：Wordwall 練習 -->
<section class="step-panel" data-step="4">
  <h2 class="panel-title">④ Wordwall 題庫練習</h2>

  <div class="quiz-group">
    <div class="group-heading">交通標誌</div>
    <div class="quiz-btns">
      <a class="quiz-btn" target="_blank" rel="noopener" href="https://wordwall.net/tc/resource/118706918"><span class="icon">🃏</span>隨機卡</a>
      <a class="quiz-btn" target="_blank" rel="noopener" href="https://wordwall.net/tc/resource/118706980"><span class="icon">🔎</span>圖片文字匹配</a>
      <a class="quiz-btn" target="_blank" rel="noopener" href="https://wordwall.net/tc/resource/118707067"><span class="icon">🔊</span>只有聲音</a>
      <a class="quiz-btn" target="_blank" rel="noopener" href="https://wordwall.net/tc/resource/118707130"><span class="icon">🖼️</span>圖像測驗</a>
    </div>
  </div>
</section>

<script src="js/unit.js"></script>
</body>
</html>
