<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家具｜認知圖卡網站</title>
<link rel="stylesheet" href="../css/site.css">
</head>
<body>

<a class="top-link" href="../index.html">← 返回首頁</a>

<div class="unit-header">
  <h1>🛋️ 家具</h1>
  <div class="sub">19家具（共 10 項）</div>
</div>

<div class="stepper">
  <button class="step-btn" data-step="1"><span class="num">1</span>圖卡認識</button>
  <button class="step-btn" data-step="2"><span class="num">2</span>教學影片</button>
  <button class="step-btn" data-step="3"><span class="num">3</span>造詞造句</button>
  <button class="step-btn" data-step="4"><span class="num">4</span>Wordwall 練習</button>
</div>

<!-- Step 1：圖卡認識 -->
<section class="step-panel" data-step="1">
  <h2 class="panel-title">① 圖卡認識：點卡片聽發音</h2>

  <div class="view-toggle">
    <button class="view-btn" data-view="grid">🔲 全部呈現</button>
    <button class="view-btn" data-view="single">➡️ 逐張瀏覽</button>
  </div>

  <!-- 全部呈現 -->
  <div class="view-panel" data-view="grid">
    <div class="group-heading">家具</div>
    <div class="card-grid">
      <button class="flash-card" data-audio="19家具/assets/audio/p01.mp3"><img src="19家具/頁面截圖/000_書桌.png" alt="書桌"><span class="label">書桌</span></button>
      <button class="flash-card" data-audio="19家具/assets/audio/p02.mp3"><img src="19家具/頁面截圖/001_椅子.png" alt="椅子"><span class="label">椅子</span></button>
      <button class="flash-card" data-audio="19家具/assets/audio/p03.mp3"><img src="19家具/頁面截圖/002_書櫃.png" alt="書櫃"><span class="label">書櫃</span></button>
      <button class="flash-card" data-audio="19家具/assets/audio/p04.mp3"><img src="19家具/頁面截圖/003_置物櫃.png" alt="置物櫃"><span class="label">置物櫃</span></button>
      <button class="flash-card" data-audio="19家具/assets/audio/p05.mp3"><img src="19家具/頁面截圖/004_講桌.png" alt="講桌"><span class="label">講桌</span></button>
      <button class="flash-card" data-audio="19家具/assets/audio/p06.mp3"><img src="19家具/頁面截圖/005_鞋櫃.png" alt="鞋櫃"><span class="label">鞋櫃</span></button>
      <button class="flash-card" data-audio="19家具/assets/audio/p07.mp3"><img src="19家具/頁面截圖/006_窗簾.png" alt="窗簾"><span class="label">窗簾</span></button>
      <button class="flash-card" data-audio="19家具/assets/audio/p08.mp3"><img src="19家具/頁面截圖/007_電視櫃.png" alt="電視櫃"><span class="label">電視櫃</span></button>
      <button class="flash-card" data-audio="19家具/assets/audio/p09.mp3"><img src="19家具/頁面截圖/008_衣帽勾.png" alt="衣帽勾"><span class="label">衣帽勾</span></button>
      <button class="flash-card" data-audio="19家具/assets/audio/p10.mp3"><img src="19家具/頁面截圖/009_收納箱.png" alt="收納箱"><span class="label">收納箱</span></button>
    </div>
  </div>

  <!-- 逐張瀏覽 -->
  <div class="view-panel" data-view="single">
    <div class="single-wrap">
      <div class="single-header">
        <span id="singleGroup">家具</span>
        <span class="single-count" id="singleCount">1 / 10</span>
      </div>
      <div class="single-frame">
        <img id="singleImg" src="" alt="">
      </div>
      <div class="single-label" id="singleLabel"></div>
      <div class="single-controls">
        <button class="ctrl btn-nav" id="singlePrev" type="button">◀ 上一張</button>
        <button class="ctrl btn-play" id="singlePlay" type="button">🔊 重複播放</button>
        <button class="ctrl btn-auto" id="singleAuto" type="button">▶ 自動播放</button>
        <button class="ctrl btn-nav" id="singleNext" type="button">下一張 ▶</button>
      </div>
    </div>
  </div>

  <audio id="cardAudio" preload="none"></audio>
</section>

<!-- Step 2：教學影片 -->
<section class="step-panel" data-step="2">
  <h2 class="panel-title">② 教學影片：跟著唸讀</h2>
  <div class="link-card-row">
    <a class="link-card" href="19家具/教材播放器.html">
      <div class="emoji">🎬</div>
      <div class="title">家具 教學影片</div>
      <div class="desc">書桌、椅子、書櫃、置物櫃、講桌、鞋櫃、窗簾、電視櫃、衣帽勾、收納箱</div>
      <div class="go-btn">開始播放</div>
    </a>
  </div>
</section>

<!-- Step 3：造詞造句 -->
<section class="step-panel" data-step="3">
  <h2 class="panel-title">③ 造詞造句：跟著唸讀</h2>
  <div class="link-card-row">
    <a class="link-card" href="19家具/造詞造句版/教材播放器.html">
      <div class="emoji">📝</div>
      <div class="title">家具 造詞造句</div>
      <div class="desc">例：書桌 → 一張書桌 → 我要用書桌</div>
      <div class="go-btn">開始練習</div>
    </a>
  </div>
</section>

<!-- Step 4：Wordwall 練習 -->
<section class="step-panel" data-step="4">
  <h2 class="panel-title">④ Wordwall 題庫練習</h2>

  <div class="quiz-group">
    <div class="group-heading">家具</div>
    <div class="quiz-btns">
      <a class="quiz-btn" target="_blank" rel="noopener" href="https://wordwall.net/tc/resource/118100666"><span class="icon">🃏</span>隨機卡</a>
      <a class="quiz-btn" target="_blank" rel="noopener" href="https://wordwall.net/tc/resource/118100674"><span class="icon">🔎</span>圖片文字匹配</a>
      <a class="quiz-btn" target="_blank" rel="noopener" href="https://wordwall.net/tc/resource/118100677"><span class="icon">🔊</span>只有聲音</a>
      <a class="quiz-btn" target="_blank" rel="noopener" href="https://wordwall.net/tc/resource/118100681"><span class="icon">🖼️</span>圖像測驗</a>
    </div>
  </div>
</section>

<script src="js/unit.js"></script>
</body>
</html>
