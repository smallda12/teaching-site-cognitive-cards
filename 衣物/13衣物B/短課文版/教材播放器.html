<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>衣物 B 短課文</title>
<style>
  :root{
    --bg:#FFF6E9;
    --primary:#4A90D9;
    --primary-dark:#3573B5;
    --accent:#FF8C61;
    --accent-dark:#E8703D;
    --text:#3A3A3A;
    --dot:#D8D8D8;
    --dot-active:#4A90D9;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:var(--bg);
    font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
    color:var(--text);
    -webkit-user-select:none;user-select:none;
    overflow:hidden;
  }
  body{
    display:flex;flex-direction:column;
    align-items:center;
    height:100vh;
    padding:1.5vh 16px;
    gap:1.2vh;
  }
  header{
    display:flex;align-items:center;justify-content:center;gap:16px;
    width:100%;
    flex:0 0 auto;
    flex-wrap:wrap;
  }
  h1{
    font-size:clamp(18px,3.2vh,32px);
    margin:0;
  }
  .back-link{
    position:fixed;top:10px;left:12px;
    font-size:clamp(13px,2vh,18px);
    color:var(--primary-dark);
    text-decoration:none;
    background:#fff;
    padding:6px 14px;
    border-radius:999px;
    box-shadow:0 2px 6px rgba(0,0,0,.10);
    z-index:10;
  }
  .back-link:hover{background:var(--bg);}
  .page-count{
    font-size:clamp(14px,2.4vh,24px);
    color:var(--primary-dark);
    font-weight:bold;
    background:#fff;
    padding:4px 16px;
    border-radius:999px;
    box-shadow:0 2px 6px rgba(0,0,0,.10);
  }
  .stage{
    flex:1 1 auto;
    min-height:0;
    width:100%;
    max-width:1100px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .frame{
    max-width:100%;
    max-height:100%;
    background:#000;
    border-radius:28px;
    overflow:hidden;
    box-shadow:0 10px 28px rgba(0,0,0,.20);
    position:relative;
  }
  .frame img{
    width:100%;height:100%;object-fit:contain;
    background:#fff;
    display:block;
  }
  .dots{
    display:flex;gap:7px;flex-wrap:wrap;justify-content:center;
    max-width:900px;
    flex:0 0 auto;
  }
  .dot{
    width:clamp(9px,1.4vh,14px);height:clamp(9px,1.4vh,14px);border-radius:50%;
    background:var(--dot);
    cursor:pointer;
    transition:transform .15s, background .15s;
  }
  .dot.active{background:var(--dot-active);transform:scale(1.35);}
  .controls{
    display:flex;align-items:center;justify-content:center;gap:min(4vw,22px);
    width:100%;
    flex:0 0 auto;
    flex-wrap:wrap;
  }
  button.ctrl{
    border:none;
    border-radius:18px;
    font-size:clamp(15px,2.4vh,24px);
    font-weight:bold;
    padding:1.4vh 20px;
    min-width:110px;
    min-height:clamp(48px,7.5vh,68px);
    cursor:pointer;
    color:#fff;
    box-shadow:0 4px 10px rgba(0,0,0,.15);
    display:flex;align-items:center;justify-content:center;gap:8px;
    transition:transform .1s, opacity .15s, background .15s;
    font-family:inherit;
  }
  button.ctrl:active{transform:scale(.95);}
  button.ctrl:disabled{opacity:.35;cursor:default;}
  .btn-nav{background:var(--primary);}
  .btn-nav:hover:not(:disabled){background:var(--primary-dark);}
  .btn-play{
    background:var(--accent);
    min-width:190px;
    font-size:clamp(16px,2.7vh,26px);
  }
  .btn-play:hover{background:var(--accent-dark);}
  .btn-play.playing{animation:pulse 1s infinite;}
  .btn-auto{background:#4CAF7D;min-width:170px;}
  .btn-auto:hover{background:#3D9468;}
  .btn-auto.active{background:var(--accent-dark);animation:pulse 1s infinite;}
  @keyframes pulse{
    0%,100%{box-shadow:0 4px 10px rgba(0,0,0,.15);}
    50%{box-shadow:0 4px 24px rgba(255,140,97,.7);}
  }
</style>
</head>
<body>
  <a class="back-link" href="../../index.html">← 返回衣物單元</a>
  <header>
    <h1>衣物 B 短課文</h1>
    <div class="page-count" id="pageCount">1 / 1</div>
  </header>

  <div class="stage">
    <div class="frame">
      <img id="pageImg" src="" alt="">
    </div>
  </div>

  <div class="dots" id="dots"></div>

  <div class="controls">
    <button class="ctrl btn-nav" id="prevBtn" type="button">◀ 上一頁</button>
    <button class="ctrl btn-play" id="playBtn" type="button">🔊 重複播放</button>
    <button class="ctrl btn-auto" id="autoBtn" type="button">▶ 自動播放</button>
    <button class="ctrl btn-nav" id="nextBtn" type="button">下一頁 ▶</button>
  </div>

  <audio id="audioPlayer" preload="auto"></audio>

  <script>
  const pages = [
    {img:"頁面截圖/000_制服.png", audio:"assets/audio/p01.mp3", label:"制服"},
    {img:"頁面截圖/001_這是一件小制服.png", audio:"assets/audio/p02.mp3", label:"這是一件小制服"},
    {img:"頁面截圖/002_藍色圓領白襯衫.png", audio:"assets/audio/p03.mp3", label:"藍色圓領白襯衫"},
    {img:"頁面截圖/003_乾淨整齊真神氣.png", audio:"assets/audio/p04.mp3", label:"乾淨整齊真神氣"},
    {img:"頁面截圖/004_我穿整齊制服去上學.png", audio:"assets/audio/p05.mp3", label:"我穿整齊制服去上學"},
    {img:"頁面截圖/005_短褲.png", audio:"assets/audio/p06.mp3", label:"短褲"},
    {img:"頁面截圖/006_這是一條卡其短褲.png", audio:"assets/audio/p07.mp3", label:"這是一條卡其短褲"},
    {img:"頁面截圖/007_鬆緊褲頭好穿脫.png", audio:"assets/audio/p08.mp3", label:"鬆緊褲頭好穿脫"},
    {img:"頁面截圖/008_跑步跳躍真輕鬆.png", audio:"assets/audio/p09.mp3", label:"跑步跳躍真輕鬆"},
    {img:"頁面截圖/009_我穿舒適短褲去公園.png", audio:"assets/audio/p10.mp3", label:"我穿舒適短褲去公園"},
    {img:"頁面截圖/010_洋裝.png", audio:"assets/audio/p11.mp3", label:"洋裝"},
    {img:"頁面截圖/011_這是一件紅洋裝.png", audio:"assets/audio/p12.mp3", label:"這是一件紅洋裝"},
    {img:"頁面截圖/012_無袖圓領傘狀裙.png", audio:"assets/audio/p13.mp3", label:"無袖圓領傘狀裙"},
    {img:"頁面截圖/013_轉個圈圈像花朵.png", audio:"assets/audio/p14.mp3", label:"轉個圈圈像花朵"},
    {img:"頁面截圖/014_妹妹穿紅洋裝轉圈圈.png", audio:"assets/audio/p15.mp3", label:"妹妹穿紅洋裝轉圈圈"},
    {img:"頁面截圖/015_毛衣.png", audio:"assets/audio/p16.mp3", label:"毛衣"},
    {img:"頁面截圖/016_這是一件厚毛衣.png", audio:"assets/audio/p17.mp3", label:"這是一件厚毛衣"},
    {img:"頁面截圖/017_駝色粗針織花紋.png", audio:"assets/audio/p18.mp3", label:"駝色粗針織花紋"},
    {img:"頁面截圖/018_天氣變冷好保暖.png", audio:"assets/audio/p19.mp3", label:"天氣變冷好保暖"},
    {img:"頁面截圖/019_天氣好冷我穿厚毛衣.png", audio:"assets/audio/p20.mp3", label:"天氣好冷我穿厚毛衣"},
    {img:"頁面截圖/020_拖鞋.png", audio:"assets/audio/p21.mp3", label:"拖鞋"},
    {img:"頁面截圖/021_這是一雙藍拖鞋.png", audio:"assets/audio/p22.mp3", label:"這是一雙藍拖鞋"},
    {img:"頁面截圖/022_人字夾腳好穿脫.png", audio:"assets/audio/p23.mp3", label:"人字夾腳好穿脫"},
    {img:"頁面截圖/023_在家走路好輕鬆.png", audio:"assets/audio/p24.mp3", label:"在家走路好輕鬆"},
    {img:"頁面截圖/024_回到家我換穿拖鞋.png", audio:"assets/audio/p25.mp3", label:"回到家我換穿拖鞋"},
    {img:"頁面截圖/025_涼鞋.png", audio:"assets/audio/p26.mp3", label:"涼鞋"},
    {img:"頁面截圖/026_這是一雙皮涼鞋.png", audio:"assets/audio/p27.mp3", label:"這是一雙皮涼鞋"},
    {img:"頁面截圖/027_多條扣帶很透氣.png", audio:"assets/audio/p28.mp3", label:"多條扣帶很透氣"},
    {img:"頁面截圖/028_夏天通風不悶熱.png", audio:"assets/audio/p29.mp3", label:"夏天通風不悶熱"},
    {img:"頁面截圖/029_天氣熱我穿涼鞋散步.png", audio:"assets/audio/p30.mp3", label:"天氣熱我穿涼鞋散步"},
    {img:"頁面截圖/030_雨鞋.png", audio:"assets/audio/p31.mp3", label:"雨鞋"},
    {img:"頁面截圖/031_這是一雙黃雨鞋.png", audio:"assets/audio/p32.mp3", label:"這是一雙黃雨鞋"},
    {img:"頁面截圖/032_高筒防水不弄濕.png", audio:"assets/audio/p33.mp3", label:"高筒防水不弄濕"},
    {img:"頁面截圖/033_下雨天不怕踩水.png", audio:"assets/audio/p34.mp3", label:"下雨天不怕踩水"},
    {img:"頁面截圖/034_下雨天我穿雨鞋踩水.png", audio:"assets/audio/p35.mp3", label:"下雨天我穿雨鞋踩水"},
    {img:"頁面截圖/035_內衣.png", audio:"assets/audio/p36.mp3", label:"內衣"},
    {img:"頁面截圖/036_這是一件白內衣.png", audio:"assets/audio/p37.mp3", label:"這是一件白內衣"},
    {img:"頁面截圖/037_純棉無袖最透氣.png", audio:"assets/audio/p38.mp3", label:"純棉無袖最透氣"},
    {img:"頁面截圖/038_貼身吸汗好舒服.png", audio:"assets/audio/p39.mp3", label:"貼身吸汗好舒服"},
    {img:"頁面截圖/039_洗完澡我穿乾淨內衣.png", audio:"assets/audio/p40.mp3", label:"洗完澡我穿乾淨內衣"},
    {img:"頁面截圖/040_睡衣.png", audio:"assets/audio/p41.mp3", label:"睡衣"},
    {img:"頁面截圖/041_這是一套藍睡衣.png", audio:"assets/audio/p42.mp3", label:"這是一套藍睡衣"},
    {img:"頁面截圖/042_格紋套裝好柔軟.png", audio:"assets/audio/p43.mp3", label:"格紋套裝好柔軟"},
    {img:"頁面截圖/043_躺在床上準備睡.png", audio:"assets/audio/p44.mp3", label:"躺在床上準備睡"},
    {img:"頁面截圖/044_睡覺前我穿藍色睡衣.png", audio:"assets/audio/p45.mp3", label:"睡覺前我穿藍色睡衣"},
    {img:"頁面截圖/045_口罩.png", audio:"assets/audio/p46.mp3", label:"口罩"},
    {img:"頁面截圖/046_這是一片藍口罩.png", audio:"assets/audio/p47.mp3", label:"這是一片藍口罩"},
    {img:"頁面截圖/047_彈性耳掛遮口鼻.png", audio:"assets/audio/p48.mp3", label:"彈性耳掛遮口鼻"},
    {img:"頁面截圖/048_保護健康防灰塵.png", audio:"assets/audio/p49.mp3", label:"保護健康防灰塵"},
    {img:"頁面截圖/049_出門搭車我戴好口罩.png", audio:"assets/audio/p50.mp3", label:"出門搭車我戴好口罩"},
  ];

  let current = 0;
  let audioUnlocked = false;
  let autoPlay = false;
  let autoTimer = null;

  const pageImg = document.getElementById('pageImg');
  const pageCount = document.getElementById('pageCount');
  const dotsWrap = document.getElementById('dots');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const playBtn = document.getElementById('playBtn');
  const autoBtn = document.getElementById('autoBtn');
  const audioPlayer = document.getElementById('audioPlayer');
  const stage = document.querySelector('.stage');
  const frame = document.querySelector('.frame');

  // 讓 16:9 的畫面框在「扣掉頁碼／圓點／按鈕之後剩下的空間」裡盡量放大，
  // 同時保證整頁一定塞得進 100vh，不需要捲動——純 CSS（flex + aspect-ratio）
  // 在直式或接近正方形的視窗下算不準，用 JS 直接量測、算好再賦值最可靠。
  function fitFrame(){
    const ratio = 1.0;
    const availW = stage.clientWidth;
    const availH = stage.clientHeight;
    let w = availW, h = w / ratio;
    if (h > availH){ h = availH; w = h * ratio; }
    frame.style.width = w + 'px';
    frame.style.height = h + 'px';
  }
  window.addEventListener('resize', fitFrame);
  fitFrame();

  pages.forEach((_, i) => {
    const dot = document.createElement('div');
    dot.className = 'dot';
    dot.addEventListener('click', () => goTo(i));
    dotsWrap.appendChild(dot);
  });
  const dotEls = Array.from(dotsWrap.children);

  function updateDots(){
    dotEls.forEach((d,i)=> d.classList.toggle('active', i===current));
  }

  function playCurrentAudio(){
    audioPlayer.currentTime = 0;
    const p = audioPlayer.play();
    if (p !== undefined){
      p.then(()=>{
        audioUnlocked = true;
        playBtn.classList.add('playing');
      }).catch(()=>{
        // 瀏覽器擋自動播放時靜靜失敗即可，按「重複播放」按鈕還是能手動播放
      });
    }
  }


  function updateAutoBtn(){
    autoBtn.classList.toggle('active', autoPlay);
    autoBtn.textContent = autoPlay ? '⏸ 停止自動播放' : '▶ 自動播放';
  }

  function stopAuto(){
    autoPlay = false;
    updateAutoBtn();
    clearTimeout(autoTimer);
  }

  function render(autoplay){
    const page = pages[current];
    pageImg.src = page.img;
    pageImg.alt = page.label;
    pageCount.textContent = (current+1) + ' / ' + pages.length;
    audioPlayer.src = page.audio;
    prevBtn.disabled = current === 0;
    nextBtn.disabled = current === pages.length - 1;
    updateDots();
    playBtn.classList.remove('playing');
    if (autoplay){
      playCurrentAudio();
    }
  }

  function goTo(i){
    if (i<0 || i>=pages.length) return;
    current = i;
    render(true);
  }

  prevBtn.addEventListener('click', ()=> { stopAuto(); goTo(current-1); });
  nextBtn.addEventListener('click', ()=> { stopAuto(); goTo(current+1); });
  playBtn.addEventListener('click', ()=> { audioUnlocked = true; playCurrentAudio(); });
  autoBtn.addEventListener('click', ()=>{
    audioUnlocked = true;
    autoPlay = !autoPlay;
    updateAutoBtn();
    if (autoPlay) playCurrentAudio();
    else clearTimeout(autoTimer);
  });

  audioPlayer.addEventListener('ended', ()=>{
    playBtn.classList.remove('playing');
    if (!autoPlay) return;
    if (current < pages.length - 1){
      autoTimer = setTimeout(()=> goTo(current+1), 700);
    } else {
      stopAuto();
    }
  });

  document.addEventListener('keydown', (e)=>{
    if (e.key === 'ArrowRight'){ stopAuto(); goTo(current+1); }
    else if (e.key === 'ArrowLeft'){ stopAuto(); goTo(current-1); }
    else if (e.key === ' '){ e.preventDefault(); playCurrentAudio(); }
  });

  render(true);
  </script>
</body>
</html>
